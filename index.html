<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플스토리 헤네시스 스타포스 나눗셈</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background: #0b0f19;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            color: #ffeb3b;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 12px;
            font-size: 22px;
        }

        .game-container {
            width: 100%;
            max-width: 850px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* 헤네시스 맵 캔버스 영역 */
        .map-frame {
            position: relative;
            width: 100%;
            height: 260px;
            border: 4px solid #5c3d2e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* 메이플 정통 스타포스 UI 패널 */
        .sf-window {
            background: linear-gradient(to bottom, #3a2e26, #1c1510);
            border: 4px solid #8c6747;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #5c4331;
            padding-bottom: 8px;
            color: #f1c40f;
            font-weight: bold;
        }

        .sf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media(max-width: 600px) {
            .sf-grid { grid-template-columns: 1fr; }
        }

        .sf-card {
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid #5c4331;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item-preview {
            width: 80px; height: 80px;
            background: #111;
            border: 2px solid #f1c40f;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
            box-shadow: inset 0 0 12px rgba(241, 196, 15, 0.4);
        }

        .item-preview img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .item-title {
            font-size: 16px;
            font-weight: bold;
            color: #ffeb3b;
        }

        .stars-txt {
            color: #f1c40f;
            font-size: 18px;
            margin: 4px 0;
        }

        .rates-box {
            width: 100%;
            font-size: 13px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 4px;
            margin-top: 6px;
        }

        .rate-line {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
        }

        /* 인벤토리 격자 */
        .inven-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            width: 100%;
            margin-top: 8px;
        }

        .inven-slot {
            aspect-ratio: 1;
            background: #18120d;
            border: 1px solid #5c4331;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inven-slot img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .inven-slot.active {
            border: 2px solid #f1c40f;
            background: #2a2017;
            box-shadow: 0 0 8px #f1c40f;
        }

        /* 나눗셈 문제 창 */
        .quiz-panel {
            background: #16100c;
            border: 2px solid #8c6747;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .quiz-q {
            font-size: 26px;
            font-weight: bold;
            color: #fff;
            margin: 8px 0;
            text-shadow: 2px 2px 4px #000;
        }

        .quiz-opts {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 6px;
        }

        .opt-btn {
            background: linear-gradient(to bottom, #5c4331, #3a2e26);
            color: #fff;
            border: 1px solid #8c6747;
            padding: 10px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
        }

        .opt-btn:hover {
            background: linear-gradient(to bottom, #f1c40f, #d35400);
            color: #000;
            font-weight: bold;
        }

        /* 강화 연출 모달 */
        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal-box {
            background: linear-gradient(to bottom, #4a382a, #1c1510);
            border: 4px solid #f1c40f;
            border-radius: 10px;
            width: 320px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px #f1c40f;
        }

        .hammer { font-size: 50px; display: inline-block; margin-bottom: 10px; }
        .swing { animation: hammerAnim 0.3s infinite alternate; }
        @keyframes hammerAnim {
            from { transform: rotate(-20deg); }
            to { transform: rotate(20deg); }
        }

        .m-btn {
            background: #f1c40f;
            color: #000;
            border: none;
            padding: 8px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <h1>🍁 메이플스토리 헤네시스 : 스타포스 나눗셈 🍁</h1>

    <div class="game-container">
        <!-- 헤네시스 사냥터/마을 화면 -->
        <div class="map-frame">
            <canvas id="gameCanvas" width="850" height="260"></canvas>
        </div>

        <!-- 메이플 스타포스 UI -->
        <div class="sf-window">
            <div class="sf-header">
                <span>⚔️ 헤네시스 대장간 : 장비 강화 (Starforce)</span>
                <span id="topStarBadge">★ 0성</span>
            </div>

            <div class="sf-grid">
                <!-- 대상 무기 카드 -->
                <div class="sf-card">
                    <div class="item-title" id="itemName">초보자의 목검</div>
                    <div class="item-preview">
                        <img id="itemImg" src="https://maplestory.io/api/KMS/352/item/1302000/icon" alt="무기">
                    </div>
                    <div class="stars-txt" id="starTxt">★ 0 / 50성</div>

                    <div class="rates-box">
                        <div class="rate-line"><span>성공 확률:</span> <b id="sucRate" style="color:#2ecc71;">95%</b></div>
                        <div class="rate-line"><span>하락 확률:</span> <b id="dropRate" style="color:#e67e22;">0%</b></div>
                        <div class="rate-line"><span>파괴 확률:</span> <b id="desRate" style="color:#e74c3c;">0%</b></div>
                    </div>
                </div>

                <!-- 인벤토리 격자 -->
                <div class="sf-card" style="align-items: flex-start;">
                    <div style="font-size: 13px; color: #ccc;">장비 인벤토리</div>
                    <div class="inven-grid" id="invenGrid"></div>
                </div>
            </div>

            <!-- 나눗셈 문제 패널 -->
            <div class="quiz-panel">
                <div style="font-size: 13px; color: #aaa;">나눗셈 문제를 정답 처리하면 스타포스 주문서가 발동합니다.</div>
                <div class="quiz-q" id="quizQ">85 ÷ 4 = ?</div>
                <div class="quiz-opts" id="optsBox"></div>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="sfModal" class="modal-bg">
        <div class="modal-box">
            <div id="hammerIcon" class="hammer">🔨</div>
            <h2 id="modalTitle" style="color:#f1c40f; font-size:22px;">강화 중...</h2>
            <div id="modalDesc" style="font-size:14px; margin-top:6px; color:#ddd;">스타포스 주문서의 기운이 모입니다!</div>
            <button id="modalBtn" class="m-btn" onclick="closeModal()" style="display:none;">확인</button>
        </div>
    </div>

    <script>
        // 메이플스토리 오픈 API의 실제 무기 아이콘 이미지 주소 연결 (목검 ~ 제네시스소드)
        const weapons = [
            { level: 0, name: "초보자의 목검", img: "https://maplestory.io/api/KMS/352/item/1302000/icon" },
            { level: 5, name: "하이랜더", img: "https://maplestory.io/api/KMS/352/item/1402002/icon" },
            { level: 10, name: "호검", img: "https://maplestory.io/api/KMS/352/item/1402004/icon" },
            { level: 15, name: "그륜힐", img: "https://maplestory.io/api/KMS/352/item/1402008/icon" },
            { level: 20, name: "드래곤 클레이모어", img: "https://maplestory.io/api/KMS/352/item/1402018/icon" },
            { level: 25, name: "우트가르드 투핸드소드", img: "https://maplestory.io/api/KMS/352/item/1402220/icon" },
            { level: 30, name: "파프니르 페니텐시아", img: "https://maplestory.io/api/KMS/352/item/1402196/icon" },
            { level: 35, name: "앱솔랩스 브로드세이버", img: "https://maplestory.io/api/KMS/352/item/1402225/icon" },
            { level: 40, name: "아케인셰이드 두손검", img: "https://maplestory.io/api/KMS/352/item/1402255/icon" },
            { level: 48, name: "제네시스 투핸드소드", img: "https://maplestory.io/api/KMS/352/item/1402259/icon" }
        ];

        let currentStar = 0;
        let isDestroyed = false;
        let currentQuiz = {};

        // 배경 및 이미지 로딩
        const bgImg = new Image();
        bgImg.src = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop";

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function initInven() {
            const grid = document.getElementById('invenGrid');
            grid.innerHTML = '';
            for(let i=0; i<16; i++) {
                let slot = document.createElement('div');
                slot.className = 'inven-slot';
                if(i === 0) {
                    slot.classList.add('active');
                    let img = document.createElement('img');
                    img.id = 'invenSlotImg';
                    img.src = weapons[0].img;
                    slot.appendChild(img);
                }
                grid.appendChild(slot);
            }
        }

        function getRates(star) {
            if (star < 10) return { success: 95 - star * 2, drop: 0, destroy: 0 };
            if (star < 20) return { success: Math.round(65 - (star-10)*1.5), drop: Math.round(20 + (star-10)), destroy: 0 };
            if (star < 35) {
                let des = 5 + Math.floor((star-20)/3);
                let suc = 45 - (star-20)*0.8;
                return { success: Math.round(suc), drop: Math.round(100 - suc - des), destroy: des };
            }
            if (star < 50) {
                let des = 10 + Math.floor((star-35));
                let suc = Math.max(10, Math.round(30 - (star-35)*0.5));
                return { success: suc, drop: Math.round(100 - suc - des), destroy: Math.min(40, des) };
            }
            return { success: 0, drop: 0, destroy: 0 };
        }

        function generateQuiz() {
            const is3D = Math.random() < 0.5;
            const divisor = Math.floor(Math.random() * 8) + 2;
            const dividend = is3D ? Math.floor(Math.random() * 800) + 100 : Math.floor(Math.random() * 80) + 10;

            const q = Math.floor(dividend / divisor);
            const r = dividend % divisor;
            const correctStr = `몫: ${q}, 나머지: ${r}`;

            let opts = new Set();
            opts.add(correctStr);
            while(opts.size < 5) {
                let fq = q + (Math.floor(Math.random()*7) - 3);
                let fr = r + (Math.floor(Math.random()*5) - 2);
                if(fq < 0) fq = 0;
                if(fr < 0 || fr >= divisor) fr = Math.max(0, divisor - 1);
                opts.add(`몫: ${fq}, 나머지: ${fr}`);
            }

            currentQuiz = {
                question: `${dividend} ÷ ${divisor} = ?`,
                correct: correctStr,
                options: Array.from(opts).sort(() => Math.random() - 0.5)
            };
            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizQ').innerText = currentQuiz.question;
            const box = document.getElementById('optsBox');
            box.innerHTML = '';
            currentQuiz.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                box.appendChild(btn);
            });
            updateUI();
        }

        function updateUI() {
            let rates = getRates(currentStar);
            document.getElementById('starTxt').innerText = `★ ${currentStar} / 50성`;
            document.getElementById('topStarBadge').innerText = `★ ${currentStar}성`;
            document.getElementById('sucRate').innerText = `${rates.success}%`;
            document.getElementById('dropRate').innerText = `${rates.drop}%`;
            document.getElementById('desRate').innerText = `${rates.destroy}%`;

            let curWeapon = weapons[0];
            for(let w of weapons) {
                if(currentStar >= w.level) curWeapon = w;
            }
            document.getElementById('itemName').innerText = curWeapon.name;
            document.getElementById('itemImg').src = curWeapon.img;

            let invenImg = document.getElementById('invenSlotImg');
            if(invenImg) invenImg.src = curWeapon.img;
        }

        function checkAnswer(selected) {
            if(isDestroyed) {
                alert("무기가 파괴되었습니다! 모달 창에서 초기화 후 도전하세요.");
                return;
            }
            if(selected === currentQuiz.correct) {
                runStarforceAnim();
            } else {
                alert(`❌ 오답입니다!\n정답: ${currentQuiz.correct}`);
                generateQuiz();
            }
        }

        function runStarforceAnim() {
            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btn = document.getElementById('modalBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer swing';
            hammer.innerText = '🔨';
            title.innerText = '강화 중...';
            title.style.color = '#f1c40f';
            desc.innerText = '주문서의 힘이 무기에 주입되는 중입니다!';
            btn.style.display = 'none';

            setTimeout(() => {
                hammer.className = 'hammer';
                let rates = getRates(currentStar);
                let rand = Math.random() * 100;

                if(rand < rates.success) {
                    currentStar++;
                    hammer.innerText = '✨';
                    title.innerText = 'SUCCESS!';
                    title.style.color = '#2ecc71';
                    desc.innerText = `강화 성공! ★ ${currentStar}성에 도달했습니다!`;
                } else if(rand < rates.success + rates.drop) {
                    currentStar = Math.max(0, currentStar - 1);
                    hammer.innerText = '💧';
                    title.innerText = 'FAIL (단계 하락)';
                    title.style.color = '#e67e22';
                    desc.innerText = `아쉽게 실패하여 ★ ${currentStar}성으로 하락했습니다.`;
                } else {
                    isDestroyed = true;
                    hammer.innerText = '💥';
                    title.innerText = 'DESTROYED!';
                    title.style.color = '#e74c3c';
                    desc.innerText = '장비가 파괴되었습니다! 0성부터 다시 시작해야 합니다.';
                    btn.innerText = '0성부터 다시 시작';
                }

                btn.style.display = 'inline-block';
                updateUI();
                generateQuiz();
            }, 1200);
        }

        function closeModal() {
            if(isDestroyed) {
                currentStar = 0;
                isDestroyed = false;
                updateUI();
            }
            document.getElementById('sfModal').style.display = 'none';
        }

        // 헤네시스 지형 캔버스 그리기
        let animOffset = 0;
        function drawHenesys() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animOffset += 0.04;

            // 하늘 배경
            ctx.fillStyle = '#64b5f6';
            ctx.fillRect(0, 0, canvas.width, 180);

            // 헤네시스 돌담 & 풀밭 (올려주신 사진 속 지형 구조)
            ctx.fillStyle = '#795548'; // 돌담 바탕
            ctx.fillRect(0, 180, canvas.width, 80);

            // 돌담 텍스처
            ctx.fillStyle = '#5d4037';
            for(let x=0; x<canvas.width; x+=40) {
                ctx.fillRect(x, 200, 38, 18);
                ctx.fillRect(x + 20, 222, 38, 18);
                ctx.fillRect(x, 244, 38, 16);
            }

            // 상단 녹색 풀밭 레이어
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(0, 175, canvas.width, 10);
            ctx.fillStyle = '#81c784';
            ctx.fillRect(0, 175, canvas.width, 3);

            // 헤네시스 주황버섯 몬스터
            let mY = 150 + Math.sin(animOffset)*4;
            ctx.fillStyle = '#ff9800';
            ctx.beginPath();
            ctx.arc(650, mY, 22, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#fff3e0';
            ctx.fillRect(638, mY, 24, 18);

            // 캐릭터
            ctx.fillStyle = '#e91e63';
            ctx.fillRect(120, 140, 22, 38);

            requestAnimationFrame(drawHenesys);
        }

        initInven();
        generateQuiz();
        drawHenesys();
    </script>
</body>
</html>
