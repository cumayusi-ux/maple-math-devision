<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플스토리 스타포스 나눗셈 탐험대</title>
    <style>
        @font-family {
            font-family: 'Maplestory';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Maplestory', 'Malgun Gothic', sans-serif;
        }

        body {
            background: #0f0f1a url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        /* 메이플 고유 프레임 UI */
        .maple-window {
            background: rgba(18, 20, 29, 0.92);
            border: 4px solid #f39c12;
            border-image: linear-gradient(to bottom, #ffe082, #b78103) 1;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            width: 100%;
            max-width: 820px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .maple-header {
            background: linear-gradient(to bottom, #3a3f58, #1e2233);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #5c3d2e;
        }

        .maple-title {
            color: #ffeb3b;
            font-size: 20px;
            text-shadow: 2px 2px 2px #000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .maple-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: linear-gradient(to bottom, #5282b8, #a1c4fd);
            border: 3px solid #2c3e50;
            border-radius: 6px;
            overflow: hidden;
        }

        /* 메이플 스타포스 강회창 스타일 */
        .starforce-card {
            background: linear-gradient(to bottom, #2b2e3e, #1a1c26);
            border: 2px solid #e0a96d;
            border-radius: 8px;
            padding: 15px;
            box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.6);
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 10px;
            border: 1px solid #4a3b2c;
        }

        .star-display {
            color: #ffea00;
            font-size: 22px;
            text-shadow: 0 0 8px #ff9800;
        }

        .weapon-name {
            font-size: 18px;
            font-weight: bold;
            text-shadow: 1px 1px 2px #000;
        }

        .rates-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(0, 0, 0, 0.3);
            padding: 8px;
            border-radius: 4px;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .quiz-box {
            background: rgba(10, 15, 25, 0.8);
            border: 2px solid #5d6d7e;
            border-radius: 6px;
            padding: 15px;
            text-align: center;
        }

        .quiz-title {
            color: #abb2b9;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .quiz-question {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px #000;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .option-btn {
            background: linear-gradient(to bottom, #34495e, #2c3e50);
            color: #fff;
            border: 2px solid #5d6d7e;
            padding: 12px;
            font-size: 17px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            text-shadow: 1px 1px 2px #000;
        }

        .option-btn:hover {
            background: linear-gradient(to bottom, #f39c12, #d35400);
            border-color: #fff;
            transform: scale(1.01);
        }

        /* 메이플 스타포스 애니메이션 연출 팝업 */
        .sf-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .sf-modal {
            background: linear-gradient(to bottom, #2c3e50, #0f171e);
            border: 4px solid #f39c12;
            border-radius: 12px;
            width: 360px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 30px #f39c12;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            from { transform: scale(0.7); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .hammer-anim {
            font-size: 60px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .hammer-swing {
            animation: swing 0.4s infinite alternate;
        }

        @keyframes swing {
            from { transform: rotate(-20deg); }
            to { transform: rotate(30deg); }
        }

        .sf-result-title {
            font-size: 26px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }

        .btn-confirm {
            background: linear-gradient(to bottom, #27ae60, #1e8449);
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-confirm:hover {
            background: linear-gradient(to bottom, #2ecc71, #27ae60);
        }
    </style>
</head>
<body>

    <div class="maple-window">
        <div class="maple-header">
            <div class="maple-title">🍁 메이플스토리 : 50성 스타포스 나눗셈 🍁</div>
            <div style="font-size: 12px; color: #aaa;">접속할 때마다 새로운 캐릭터 등장!</div>
        </div>

        <div class="maple-body">
            <!-- 사냥터 캔버스 -->
            <div class="canvas-container">
                <canvas id="gameCanvas" width="800" height="280"></canvas>
            </div>

            <!-- 스타포스 강화판 -->
            <div class="starforce-card">
                <div class="status-row">
                    <div>현재 장비: <span id="weaponName" class="weapon-name">초보자의 목검</span></div>
                    <div class="star-display" id="starDisplay">★ 0 / 50성</div>
                </div>

                <div class="rates-bar">
                    <span>성공률: <b id="successRate" style="color: #2ecc71;">95%</b></span>
                    <span>하락률: <b id="dropRate" style="color: #e67e22;">0%</b></span>
                    <span>파괴율: <b id="destroyRate" style="color: #e74c3c;">0%</b></span>
                </div>

                <div class="quiz-box">
                    <div class="quiz-title">나눗셈 문제 정답을 맞혀 주문서의 힘을 모으세요!</div>
                    <div class="quiz-question" id="quizQuestion">85 ÷ 4 = ?</div>
                    <div class="options-grid" id="optionsContainer">
                        <!-- 5지선다 선택지 -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 스타포스 이펙트 연출 팝업 모달 -->
    <div id="sfModal" class="sf-overlay">
        <div class="sf-modal">
            <div id="hammerIcon" class="hammer-anim">🔨</div>
            <div id="sfTitle" class="sf-result-title">강화 중...</div>
            <div id="sfBody" style="color: #ddd; font-size: 15px;">주문서의 힘이 스며듭니다!</div>
            <button id="modalBtn" class="btn-confirm" onclick="closeModal()" style="display: none;">확인</button>
        </div>
    </div>

    <script>
        // 무기 등급 계보 (메이플스토리 실제 대표 아이템 계보)
        const weapons = [
            { level: 0, name: "초보자의 목검", color: "#8d6e63" },
            { level: 5, name: "하이랜더", color: "#b0bec5" },
            { level: 10, name: "호검", color: "#4caf50" },
            { level: 15, name: "그륜힐", color: "#29b6f6" },
            { level: 20, name: "드래곤 클레이모어", color: "#ab47bc" },
            { level: 25, name: "우트가르드 소드", color: "#ffa726" },
            { level: 30, name: "파프니르 페니텐시아", color: "#ef5350" },
            { level: 35, name: "앱솔랩스 브로드세이버", color: "#9c27b0" },
            { level: 40, name: "아케인셰이드 두손검", color: "#00bcd4" },
            { level: 48, name: "제네시스 투핸드소드", color: "#ffeb3b" }
        ];

        // 랜덤 캐릭터 외형 (접속 시마다 다름)
        const getRandomColor = () => '#' + Math.floor(Math.random()*16777215).toString(16);
        const avatarParams = {
            hairColor: ['#e74c3c', '#3498db', '#f1c40f', '#2ecc71', '#9b59b6', '#e67e22', '#1abc9c'][Math.floor(Math.random()*7)],
            skinColor: ['#ffe0bd', '#ffd1a4', '#f1c27d'][Math.floor(Math.random()*3)],
            shirtColor: getRandomColor(),
            pantsColor: getRandomColor(),
            eyeType: Math.floor(Math.random() * 3) // 0: 일반, 1: 웃는눈, 2: 초롱초롱
        };

        let currentStar = 0;
        let isDestroyed = false;
        let currentQuiz = {};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 플레이어 & 몬스터
        const player = { x: 120, y: 170 };
        const monster = { x: 620, y: 180, dir: -1, offset: 0 };
        let particles = [];

        // --- 스타포스 확률 계산기 ---
        function getRates(star) {
            if (star < 10) {
                return { success: 95 - star * 2, drop: 0, destroy: 0 };
            } else if (star < 20) {
                let success = 65 - (star - 10) * 1.5;
                let drop = 20 + (star - 10) * 1;
                return { success: Math.round(success), drop: Math.round(drop), destroy: 0 };
            } else if (star < 35) {
                let destroy = 5 + Math.floor((star - 20) / 3);
                let success = 45 - (star - 20) * 0.8;
                let drop = 100 - success - destroy;
                return { success: Math.round(success), drop: Math.round(drop), destroy: destroy };
            } else if (star < 50) {
                let destroy = 10 + Math.floor((star - 35) / 1);
                let success = 30 - (star - 35) * 0.5;
                let drop = 100 - success - destroy;
                return { success: Math.max(10, Math.round(success)), drop: Math.round(drop), destroy: Math.min(40, destroy) };
            }
            return { success: 0, drop: 0, destroy: 0 };
        }

        // --- 초등 3학년 나눗셈 문제 생성기 ---
        function generateQuiz() {
            const isThreeDigit = Math.random() < 0.5;
            const divisor = Math.floor(Math.random() * 8) + 2; // 2~9
            let dividend = isThreeDigit ? Math.floor(Math.random() * 800) + 100 : Math.floor(Math.random() * 80) + 10;

            const quotient = Math.floor(dividend / divisor);
            const remainder = dividend % divisor;
            const correctAnswer = `몫: ${quotient}, 나머지: ${remainder}`;

            let options = new Set();
            options.add(correctAnswer);

            while (options.size < 5) {
                let fakeQ = quotient + (Math.floor(Math.random() * 7) - 3);
                let fakeR = remainder + (Math.floor(Math.random() * 5) - 2);
                if (fakeQ < 0) fakeQ = 0;
                if (fakeR < 0 || fakeR >= divisor) fakeR = Math.max(0, divisor - 1);

                options.add(`몫: ${fakeQ}, 나머지: ${fakeR}`);
            }

            currentQuiz = {
                question: `${dividend} ÷ ${divisor} = ?`,
                correct: correctAnswer,
                options: Array.from(options).sort(() => Math.random() - 0.5)
            };

            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizQuestion').innerText = currentQuiz.question;
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            currentQuiz.options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                container.appendChild(btn);
            });

            updateUI();
        }

        function updateUI() {
            const rates = getRates(currentStar);
            document.getElementById('starDisplay').innerText = `★ ${currentStar} / 50성`;
            document.getElementById('successRate').innerText = `${rates.success}%`;
            document.getElementById('dropRate').innerText = `${rates.drop}%`;
            document.getElementById('destroyRate').innerText = `${rates.destroy}%`;

            let curWeapon = weapons[0];
            for (let w of weapons) {
                if (currentStar >= w.level) curWeapon = w;
            }
            const nameEl = document.getElementById('weaponName');
            nameEl.innerText = curWeapon.name;
            nameEl.style.color = curWeapon.color;
        }

        // --- 정답 판정 & 메이플 스타포스 연출 실행 ---
        function checkAnswer(selected) {
            if (isDestroyed) {
                alert("무기가 파괴된 상태입니다! 다시 시작 버튼을 눌러주세요.");
                return;
            }

            if (selected === currentQuiz.correct) {
                startStarforceAnim();
            } else {
                alert(`❌ 오답입니다!\n정답: ${currentQuiz.correct}`);
                generateQuiz();
            }
        }

        function startStarforceAnim() {
            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerIcon');
            const title = document.getElementById('sfTitle');
            const body = document.getElementById('sfBody');
            const btn = document.getElementById('modalBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer-anim hammer-swing';
            hammer.innerText = '🔨';
            title.innerText = '강화 진행 중...';
            title.style.color = '#ffeb3b';
            body.innerText = '주문서의 힘이 스며들고 있습니다!';
            btn.style.display = 'none';

            setTimeout(() => {
                hammer.className = 'hammer-anim';
                const rates = getRates(currentStar);
                const rand = Math.random() * 100;

                if (rand < rates.success) {
                    currentStar++;
                    hammer.innerText = '🌟';
                    title.innerText = ' SUCCESS!!';
                    title.style.color = '#2ecc71';
                    body.innerText = `강화 성공! ★ ${currentStar}성에 도달했습니다!`;
                    spawnParticles('#ffea00');
                } else if (rand < rates.success + rates.drop) {
                    currentStar = Math.max(0, currentStar - 1);
                    hammer.innerText = '💧';
                    title.innerText = 'FAIL...';
                    title.style.color = '#e67e22';
                    body.innerText = `강화 실패로 ★ ${currentStar}성으로 단계가 하락했습니다.`;
                } else {
                    isDestroyed = true;
                    hammer.innerText = '💥';
                    title.innerText = 'DESTROYED!';
                    title.style.color = '#e74c3c';
                    body.innerText = '장비가 파괴되었습니다! 0성부터 다시 도전하세요.';
                    btn.innerText = '0성부터 다시 시작';
                }

                btn.style.display = 'inline-block';
                updateUI();
                generateQuiz();
            }, 1200);
        }

        function closeModal() {
            if (isDestroyed) {
                currentStar = 0;
                isDestroyed = false;
                updateUI();
            }
            document.getElementById('sfModal').style.display = 'none';
        }

        function spawnParticles(color) {
            for(let i=0; i<25; i++) {
                particles.push({
                    x: player.x + 40,
                    y: player.y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    color: color,
                    life: 30
                });
            }
        }

        // --- 메이플 캐릭터 및 배경 캔버스 그리기 ---
        function drawCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. 발판 (메이플 스타일 풀밭)
            ctx.fillStyle = "#27ae60";
            ctx.fillRect(0, 230, canvas.width, 50);
            ctx.fillStyle = "#2ecc71";
            ctx.fillRect(0, 230, canvas.width, 8);

            // 2. 캐릭터 (랜덤 아바타)
            // 몸통/옷
            ctx.fillStyle = avatarParams.shirtColor;
            ctx.fillRect(player.x, player.y + 20, 25, 25);
            ctx.fillStyle = avatarParams.pantsColor;
            ctx.fillRect(player.x, player.y + 45, 25, 15);

            // 얼굴/피부
            ctx.fillStyle = avatarParams.skinColor;
            ctx.fillRect(player.x + 2, player.y, 21, 20);

            // 헤어 스타일
            ctx.fillStyle = avatarParams.hairColor;
            ctx.fillRect(player.x - 2, player.y - 6, 26, 12);
            ctx.fillRect(player.x + 15, player.y - 2, 8, 15);

            // 눈
            ctx.fillStyle = "#000";
            if (avatarParams.eyeType === 0) {
                ctx.fillRect(player.x + 14, player.y + 8, 3, 4);
            } else if (avatarParams.eyeType === 1) {
                ctx.font = "10px sans-serif";
                ctx.fillText("^", player.x + 13, player.y + 13);
            } else {
                ctx.fillStyle = "#3498db";
                ctx.fillRect(player.x + 13, player.y + 7, 4, 5);
            }

            // 무기 비주얼
            let curWeapon = weapons[0];
            for (let w of weapons) {
                if (currentStar >= w.level) curWeapon = w;
            }
            ctx.strokeStyle = curWeapon.color;
            ctx.lineWidth = 4 + Math.floor(currentStar / 8);
            ctx.beginPath();
            ctx.moveTo(player.x + 20, player.y + 30);
            ctx.lineTo(player.x + 55 + currentStar*0.3, player.y + 10 - currentStar*0.2);
            ctx.stroke();

            // 3. 몬스터 (주황버섯)
            monster.offset += 0.05;
            let mY = monster.y + Math.sin(monster.offset) * 5;

            // 버섯 갓
            ctx.fillStyle = "#e67e22";
            ctx.beginPath();
            ctx.arc(monster.x, mY, 25, Math.PI, 0);
            ctx.fill();
            // 버섯 기둥
            ctx.fillStyle = "#f5eef8";
            ctx.fillRect(monster.x - 12, mY, 24, 20);

            // 파티클 업데이트
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 5, 5);
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if(p.life <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(drawCanvas);
        }

        // 실행
        generateQuiz();
        drawCanvas();
    </script>
</body>
</html>
