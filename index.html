<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플 수학 탐험대: 50성 스타포스 나눗셈</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }
        body {
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
        }
        h1 {
            color: #f39c12;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 10px;
            font-size: 24px;
        }
        .main-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 800px;
            gap: 15px;
        }
        .canvas-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: linear-gradient(to bottom, #4a90e2, #a1c4fd);
            border: 4px solid #5c3d2e;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        canvas {
            width: 100%;
            height: 100%;
        }
        .game-panel {
            background: rgba(22, 33, 62, 0.95);
            border: 3px solid #f39c12;
            border-radius: 10px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f3460;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
        }
        .star-count {
            color: #f1c40f;
            font-size: 18px;
            text-shadow: 0 0 5px #f39c12;
        }
        .weapon-name {
            color: #e74c3c;
            font-weight: bold;
        }
        .quiz-box {
            background: #16213e;
            border: 2px solid #e94560;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }
        .quiz-title {
            color: #a8b2d1;
            font-size: 14px;
            margin-bottom: 5px;
        }
        .quiz-question {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 8px;
        }
        @media (min-width: 500px) {
            .options-grid {
                grid-template-columns: repeat(1, 1fr);
            }
        }
        .option-btn {
            background: #0f3460;
            color: #fff;
            border: 2px solid #533483;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .option-btn:hover {
            background: #e94560;
            border-color: #ffffff;
            transform: translateY(-2px);
        }
        .starforce-info {
            background: rgba(0,0,0,0.4);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            display: flex;
            justify-content: space-around;
            color: #bdc3c7;
        }
        .rate-success { color: #2ecc71; }
        .rate-fail { color: #e67e22; }
        .rate-destroy { color: #e74c3c; }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #1a1a2e;
            border: 3px solid #f39c12;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .modal-title {
            font-size: 22px;
            margin-bottom: 15px;
        }
        .modal-btn {
            background: #f39c12;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal-btn:hover {
            background: #f1c40f;
        }
        .destroyed-text {
            color: #e74c3c;
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }
        .controls-hint {
            text-align: center;
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>🍁 메이플 수학 탐험대: 50성 스타포스 🍁</h1>

    <div class="main-container">
        <!-- 게임 캔버스 (사냥터) -->
        <div class="canvas-container">
            <canvas id="gameCanvas" width="800" height="320"></canvas>
        </div>

        <!-- 게임 상태 및 문제 풀이 패널 -->
        <div class="game-panel">
            <div class="status-bar">
                <div>무기: <span id="weaponName" class="weapon-name">초보자의 목검</span></div>
                <div class="star-count" id="starDisplay">★ 0 / 50성</div>
            </div>

            <div class="starforce-info">
                <span>성공: <b id="successRate" class="rate-success">95%</b></span>
                <span>하락: <b id="dropRate" class="rate-fail">0%</b></span>
                <span>파괴: <b id="destroyRate" class="rate-destroy">0%</b></span>
            </div>

            <div class="quiz-box">
                <div class="quiz-title">나눗셈 문제를 맞히면 스타포스 강화를 시도합니다!</div>
                <div class="quiz-question" id="quizQuestion">85 ÷ 4 = ?</div>
                <div class="options-grid" id="optionsContainer">
                    <!-- 객관식 버튼 5개 -->
                </div>
            </div>
        </div>
        <div class="controls-hint">※ 키보드 방향키(이동), Space(점프), Z(공격)으로 사냥터 몬스터를 직접 공격할 수도 있습니다!</div>
    </div>

    <!-- 파괴 / 축하 모달 -->
    <div id="resultModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="modalTitle" class="modal-title">강화 결과</h2>
            <div id="modalBody">내용</div>
            <button class="modal-btn" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        // 무기 등급 데이터 (10단계)
        const weapons = [
            { level: 0, name: "초보자의 목검", color: "#8d6e63" },
            { level: 5, name: "하이랜더", color: "#b0bec5" },
            { level: 10, name: "호검", color: "#4caf50" },
            { level: 15, name: "그륜힐", color: "#29b6f6" },
            { level: 20, name: "드래곤 클레이모어", color: "#ab47bc" },
            { level: 25, name: "우트가르드 소드", color: "#ffa726" },
            { level: 30, name: "파프니르 페니텐시아", color: "#ef5350" },
            { level: 35, name: "앱솔랩스 브로드세이버", color: "#7e57c2" },
            { level: 40, name: "아케인셰이드 두손검", color: "#26c6da" },
            { level: 48, name: "제네시스 투핸드소드", color: "#ffee58" }
        ];

        let currentStar = 0;
        let isDestroyed = false;
        let currentQuiz = {};

        // 캔버스 설정
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 플레이어 & 몬스터 객체
        const player = { x: 100, y: 220, width: 30, height: 40, vy: 0, isGrounded: true, isAttacking: 0 };
        const monster = { x: 600, y: 230, width: 40, height: 30, hp: 100, maxHp: 100, direction: -1 };
        let hitEffects = [];

        // --- 확률 계산 함수 (50성 체계) ---
        function getRates(star) {
            if (star < 10) {
                // 0~9성: 0% 파괴, 높은 성공
                let success = 95 - star * 2;
                return { success: success, drop: 0, destroy: 0 };
            } else if (star < 20) {
                // 10~19성: 하락 시작
                let success = 65 - (star - 10) * 1.5;
                let drop = 20 + (star - 10) * 1;
                return { success: Math.round(success), drop: Math.round(drop), destroy: 0 };
            } else if (star < 35) {
                // 20~34성: 파괴 확률 등장 (5~10%)
                let destroy = 5 + Math.floor((star - 20) / 3);
                let success = 45 - (star - 20) * 0.8;
                let drop = 100 - success - destroy;
                return { success: Math.round(success), drop: Math.round(drop), destroy: destroy };
            } else if (star < 50) {
                // 35~49성: 높은 파괴 및 고난도
                let destroy = 10 + Math.floor((star - 35) / 1);
                let success = 30 - (star - 35) * 0.5;
                let drop = 100 - success - destroy;
                return { success: Math.max(10, Math.round(success)), drop: Math.round(drop), destroy: Math.min(40, destroy) };
            }
            return { success: 0, drop: 0, destroy: 0 };
        }

        // --- 나눗셈 문제 생성기 ---
        function generateQuiz() {
            // 2자리 또는 3자리 수 ÷ 1자리 수
            const isThreeDigit = Math.random() < 0.5;
            const divisor = Math.floor(Math.random() * 8) + 2; // 2 ~ 9
            let dividend;

            if (isThreeDigit) {
                dividend = Math.floor(Math.random() * 800) + 100; // 100 ~ 899
            } else {
                dividend = Math.floor(Math.random() * 80) + 10; // 10 ~ 89
            }

            const quotient = Math.floor(dividend / divisor);
            const remainder = dividend % divisor;

            const correctAnswer = `몫: ${quotient}, 나머지: ${remainder}`;

            // 오답 선지 4개 생성
            let options = new Set();
            options.add(correctAnswer);

            while (options.size < 5) {
                let fakeQ = quotient + (Math.floor(Math.random() * 7) - 3);
                let fakeR = remainder + (Math.floor(Math.random() * 5) - 2);

                if (fakeQ < 0) fakeQ = 0;
                if (fakeR < 0 || fakeR >= divisor) fakeR = Math.max(0, divisor - 1);

                let fakeAnswer = `몫: ${fakeQ}, 나머지: ${fakeR}`;
                options.add(fakeAnswer);
            }

            // 배열 섞기
            const shuffledOptions = Array.from(options).sort(() => Math.random() - 0.5);

            currentQuiz = {
                question: `${dividend} ÷ ${divisor} = ?`,
                correct: correctAnswer,
                options: shuffledOptions
            };

            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizQuestion').innerText = currentQuiz.question;
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';

            currentQuiz.options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = option;
                btn.onclick = () => checkAnswer(option);
                container.appendChild(btn);
            });

            updateUI();
        }

        function updateUI() {
            const rates = getRates(currentStar);
            document.getElementById('starDisplay').innerText = `★ ${currentStar} / 50성`;
            document.getElementById('successRate').innerText = `${rates.success}%`;
            document.getElementById('dropRate').innerText = `${rates.drop}%`;
            document.getElementById('destroyRate').innerText = `${rates.destroy}%`;

            // 무기 이름 업데이트
            let currentWeapon = weapons[0];
            for (let w of weapons) {
                if (currentStar >= w.level) currentWeapon = w;
            }
            const nameEl = document.getElementById('weaponName');
            nameEl.innerText = currentWeapon.name;
            nameEl.style.color = currentWeapon.color;
        }

        // --- 정답 확인 및 강화 시도 ---
        function checkAnswer(selectedOption) {
            if (isDestroyed) {
                alert("무기가 파괴되었습니다! 모달창에서 [처음부터 다시 시작]을 눌러주세요.");
                return;
            }

            if (selectedOption === currentQuiz.correct) {
                // 정답! 강화 시도
                attemptStarforce();
            } else {
                // 오답!
                showModal("❌ 오답입니다!", `정답은 <b>${currentQuiz.correct}</b> 입니다.<br>다시 집중해서 풀어보세요!`);
            }
            generateQuiz();
        }

        function attemptStarforce() {
            const rates = getRates(currentStar);
            const rand = Math.random() * 100;

            if (rand < rates.success) {
                // 성공
                currentStar++;
                showModal("✨ 강화 성공!", `성공적으로 <b>★ ${currentStar}성</b>에 도달했습니다!`);
                triggerAttackEffect(true);
            } else if (rand < rates.success + rates.drop) {
                // 하락
                currentStar = Math.max(0, currentStar - 1);
                showModal("📉 강화 실패 (단계 하락)", `강화에 실패하여 <b>★ ${currentStar}성</b>으로 떨어졌습니다.`);
            } else {
                // 파괴
                isDestroyed = true;
                showModal("💥 무기 파괴!", `<div class="destroyed-text">장비가 파괴되었습니다!</div>다시 처음부터 도전해보세요.`, true);
            }
            updateUI();
        }

        function showModal(title, bodyHtml, isDestroyedMode = false) {
            document.getElementById('modalTitle').innerHTML = title;
            let content = bodyHtml;
            if (isDestroyedMode) {
                content += `<br><button class="modal-btn" style="background:#e74c3c; color:#fff;" onclick="resetGame()">0성부터 다시 시작</button>`;
            }
            document.getElementById('modalBody').innerHTML = content;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
        }

        function resetGame() {
            currentStar = 0;
            isDestroyed = false;
            closeModal();
            updateUI();
        }

        function triggerAttackEffect(isSuccess) {
            hitEffects.push({
                x: monster.x + 20,
                y: monster.y - 10,
                text: isSuccess ? `CRITICAL! ★${currentStar}` : "MISS",
                color: isSuccess ? "#f1c40f" : "#95a5a6",
                life: 30
            });
        }

        // --- 캔버스 루프 (게임 사냥터 그래픽) ---
        function updateCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 땅 그리기
            ctx.fillStyle = "#388e3c";
            ctx.fillRect(0, 260, canvas.width, 60);

            // 플레이어 그리기
            let currentWeapon = weapons[0];
            for (let w of weapons) {
                if (currentStar >= w.level) currentWeapon = w;
            }

            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(player.x, player.y, player.width, player.height); // 몸체

            // 검 무기 비주얼
            ctx.strokeStyle = currentWeapon.color;
            ctx.lineWidth = 4 + Math.floor(currentStar / 10);
            ctx.beginPath();
            ctx.moveTo(player.x + 20, player.y + 20);
            ctx.lineTo(player.x + 50 + (currentStar * 0.5), player.y + 10 - (currentStar * 0.3));
            ctx.stroke();

            // 몬스터 (슬라임)
            monster.x += monster.direction * 0.5;
            if (monster.x < 500 || monster.x > 700) monster.direction *= -1;

            ctx.fillStyle = "#2ecc71";
            ctx.beginPath();
            ctx.arc(monster.x + 20, monster.y + 15, 20, 0, Math.PI * 2);
            ctx.fill();

            // 타격 이펙트
            for (let i = hitEffects.length - 1; i >= 0; i--) {
                let ef = hitEffects[i];
                ctx.fillStyle = ef.color;
                ctx.font = "bold 16px sans-serif";
                ctx.fillText(ef.text, ef.x, ef.y);
                ef.y -= 1;
                ef.life--;
                if (ef.life <= 0) hitEffects.splice(i, 1);
            }

            requestAnimationFrame(updateCanvas);
        }

        // 초기화 실행
        generateQuiz();
        updateCanvas();
    </script>
</body>
</html>
