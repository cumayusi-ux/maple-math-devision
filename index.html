<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민형쌤과 함께하는 나눗셈 정복</title>
    <style>
        @font-face {
            font-family: 'Maplestory';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Maplestory', 'Comic Sans MS', sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        h1 {
            color: #d35400;
            text-shadow: 2px 2px 0px #f39c12, -1px -1px 0px #fff;
            margin-bottom: 8px;
            font-size: 24px;
            letter-spacing: 1px;
            text-align: center;
        }

        .game-container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 1. 상단 숲속 사냥터 캔버스 */
        .map-frame {
            position: relative;
            width: 100%;
            height: 190px;
            border: 4px solid #f39c12;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            background: #81c784;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* 2. 하단 UI 영역 */
        .sf-window {
            background: #ffffff;
            border: 4px solid #f39c12;
            border-radius: 18px;
            padding: 12px 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #f39c12;
            padding-bottom: 6px;
            color: #d35400;
            font-size: 16px;
            font-weight: bold;
        }

        .sf-landscape-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 12px;
            align-items: stretch;
        }

        @media(max-width: 650px) {
            .sf-landscape-grid { grid-template-columns: 1fr; }
        }

        .sf-card-left {
            background: #fdfefe;
            border: 2px solid #8e44ad;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .item-preview {
            width: 75px; height: 75px;
            background: #fff;
            border: 3px solid #f1c40f;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 0;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.4);
        }

        .item-preview img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .item-title {
            font-size: 17px;
            color: #8e44ad;
            font-weight: bold;
        }

        /* 22개 별 슬롯 (4-4-4-4-4-2 띄어쓰기) */
        .stars-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2px;
            margin: 4px 0;
            padding: 6px 12px;
            background: #f4f6f7;
            border-radius: 10px;
            border: 1px solid #e5e8e8;
        }

        .star-group {
            display: flex;
            gap: 2px;
            margin-right: 8px;
        }

        .star-group:last-child {
            margin-right: 0;
        }

        .star-slot {
            font-size: 15px;
            color: #bdc3c7;
            transition: all 0.2s;
        }

        .star-slot.filled {
            color: #f1c40f;
            text-shadow: 0 0 4px #f39c12;
            transform: scale(1.1);
        }

        .stars-count-txt {
            color: #d35400;
            font-size: 15px;
            font-weight: bold;
        }

        .rates-box-compact {
            width: 100%;
            font-size: 13px;
            background: #eaeded;
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            margin-top: 4px;
            color: #2c3e50;
        }

        .quiz-panel-right {
            background: #e8f8f5;
            border: 2px solid #16a085;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .quiz-q {
            font-size: 26px;
            color: #2c3e50;
            font-weight: bold;
            margin: 6px 0;
        }

        .quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .opt-btn {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            color: #fff;
            border: 2px solid #fff;
            padding: 9px 10px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1f618d;
            transition: background 0.15s, transform 0.15s;
        }

        .opt-btn:hover {
            background: linear-gradient(to bottom, #f39c12, #e67e22);
            color: #fff;
            box-shadow: 0 3px 0 #d35400;
        }

        .opt-btn.wrong-shake {
            animation: shake 0.4s ease-in-out;
            background: linear-gradient(to bottom, #e74c3c, #c0392b) !important;
            border-color: #fadbd8 !important;
            color: #fff !important;
            box-shadow: 0 3px 0 #922b21 !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal-box {
            background: #ffffff;
            border: 4px solid #f39c12;
            border-radius: 18px;
            width: 320px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .hammer { font-size: 50px; display: inline-block; margin-bottom: 8px; }
        .swing { animation: hammerAnim 0.3s infinite alternate; }
        @keyframes hammerAnim {
            from { transform: rotate(-25deg); }
            to { transform: rotate(25deg); }
        }

        .m-btn {
            background: #f1c40f;
            color: #2c3e50;
            border: none;
            padding: 8px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
            font-weight: bold;
            box-shadow: 0 3px 0 #f39c12;
        }
    </style>
</head>
<body>

    <h1>🍁 민형쌤과 함께하는 나눗셈 정복 (파괴 없음!) 🍁</h1>

    <div class="game-container">
        <!-- 1. 상단 숲속 화면 -->
        <div class="map-frame">
            <canvas id="gameCanvas" width="960" height="190"></canvas>
        </div>

        <!-- 2. 스타포스 가로형 배치 -->
        <div class="sf-window">
            <div class="sf-header">
                <span>⚔️ 스타포스 장비 강화소 (최대 ★22성 / 파괴없음)</span>
                <span id="topStarBadge">★ 0성</span>
            </div>

            <div class="sf-landscape-grid">
                <!-- 좌측: 강화 카드 -->
                <div class="sf-card-left">
                    <div class="item-title" id="itemName">초보자의 목검</div>
                    <div class="item-preview">
                        <img id="itemImg" src="https://maplestory.io/api/KMS/352/item/1302000/icon" alt="무기">
                    </div>

                    <!-- 22개 별 슬롯 (4-4-4-4-4-2 띄어쓰기) -->
                    <div class="stars-container" id="starsBox"></div>
                    <div class="stars-count-txt" id="starTxt">★ 0 / 22성</div>

                    <div class="rates-box-compact">
                        <span>성공: <b id="sucRate" style="color:#27ae60;">99.75%</b></span>
                        <span>하락: <b id="dropRate" style="color:#e67e22;">0.25%</b></span>
                        <span>파괴: <b id="desRate" style="color:#27ae60;">0% (안전)</b></span>
                    </div>
                </div>

                <!-- 우측: 나눗셈 문제 패널 -->
                <div class="quiz-panel-right">
                    <div style="font-size: 13px; color: #c0392b; font-weight: bold;">⚠️ 오답 시 단계가 하락할 수 있으니 신중히 푸세요!</div>
                    <div class="quiz-q" id="quizQ">85 ÷ 4 = ?</div>
                    <div class="quiz-opts" id="optsBox"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="sfModal" class="modal-bg">
        <div class="modal-box">
            <div id="hammerIcon" class="hammer">🔨</div>
            <h2 id="modalTitle" style="color:#d35400; font-size:22px;">강화 진행 중...</h2>
            <div id="modalDesc" style="font-size:14px; margin-top:6px; color:#34495e;">주문서의 기운이 모입니다!</div>
            <button id="modalBtn" class="m-btn" onclick="closeModal()" style="display:none;">확인</button>
        </div>
    </div>

    <script>
        const MAX_STARS = 22;

        const weapons = [
            { level: 0, name: "초보자의 목검", img: "https://maplestory.io/api/KMS/352/item/1302000/icon" },
            { level: 3, name: "하이랜더", img: "https://maplestory.io/api/KMS/352/item/1402002/icon" },
            { level: 6, name: "호검", img: "https://maplestory.io/api/KMS/352/item/1402004/icon" },
            { level: 9, name: "그륜힐", img: "https://maplestory.io/api/KMS/352/item/1402008/icon" },
            { level: 12, name: "드래곤 클레이모어", img: "https://maplestory.io/api/KMS/352/item/1402018/icon" },
            { level: 15, name: "우트가르드 소드", img: "https://maplestory.io/api/KMS/352/item/1402220/icon" },
            { level: 18, name: "파프니르 페니텐시아", img: "https://maplestory.io/api/KMS/352/item/1402196/icon" },
            { level: 20, name: "아케인셰이드 두손검", img: "https://maplestory.io/api/KMS/352/item/1402255/icon" },
            { level: 22, name: "제네시스 투핸드소드", img: "https://maplestory.io/api/KMS/352/item/1402259/icon" }
        ];

        let currentStar = 0;
        let currentQuiz = {};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 사용자 제공 썬데이메이플 기준 확률표 매핑 (파괴율 0%)
        function getRates(star) {
            if (star >= MAX_STARS) return { success: 0, drop: 0, destroy: 0 };

            const rateTable = {
                0:  { success: 99.75, drop: 0.25 },
                1:  { success: 94.50, drop: 5.50 },
                2:  { success: 89.25, drop: 10.75 },
                3:  { success: 89.25, drop: 10.75 },
                4:  { success: 84.00, drop: 16.00 },
                5:  { success: 78.75, drop: 21.25 },
                6:  { success: 73.50, drop: 26.50 },
                7:  { success: 68.25, drop: 31.75 },
                8:  { success: 63.00, drop: 37.00 },
                9:  { success: 57.75, drop: 42.25 },
                10: { success: 52.50, drop: 47.50 },
                11: { success: 47.25, drop: 52.75 },
                12: { success: 42.00, drop: 58.00 },
                13: { success: 36.75, drop: 63.25 },
                14: { success: 31.50, drop: 68.50 },
                15: { success: 31.50, drop: 66.445 },
                16: { success: 31.50, drop: 66.445 },
                17: { success: 15.75, drop: 77.510 },
                18: { success: 15.75, drop: 77.510 },
                19: { success: 15.75, drop: 75.825 },
                20: { success: 31.50, drop: 58.225 },
                21: { success: 15.75, drop: 71.6125 },
                22: { success: 15.75, drop: 67.40 }
            };

            let data = rateTable[star] || { success: 30, drop: 70 };
            return { success: data.success, drop: data.drop, destroy: 0 };
        }

        // 22개 별 슬롯 (4-4-4-4-4-2)
        function renderStars() {
            const box = document.getElementById('starsBox');
            box.innerHTML = '';
            
            const groupSizes = [4, 4, 4, 4, 4, 2];
            let starIndex = 1;

            groupSizes.forEach(size => {
                let groupDiv = document.createElement('div');
                groupDiv.className = 'star-group';

                for (let i = 0; i < size; i++) {
                    let span = document.createElement('span');
                    span.className = 'star-slot' + (starIndex <= currentStar ? ' filled' : '');
                    span.innerText = starIndex <= currentStar ? '★' : '☆';
                    groupDiv.appendChild(span);
                    starIndex++;
                }
                box.appendChild(groupDiv);
            });
        }

        function generateQuiz() {
            const is3D = Math.random() < 0.5;
            const divisor = Math.floor(Math.random() * 8) + 2;
            const dividend = is3D ? Math.floor(Math.random() * 800) + 100 : Math.floor(Math.random() * 80) + 10;

            const q = Math.floor(dividend / divisor);
            const r = dividend % divisor;
            const correctStr = `몫: ${q}, 나머지: ${r}`;

            let opts = new Set();
            opts.add(correctStr);
            while(opts.size < 5) {
                let fq = q + (Math.floor(Math.random()*7) - 3);
                let fr = r + (Math.floor(Math.random()*5) - 2);
                if(fq < 0) fq = 0;
                if(fr < 0 || fr >= divisor) fr = Math.max(0, divisor - 1);
                opts.add(`몫: ${fq}, 나머지: ${fr}`);
            }

            currentQuiz = {
                question: `${dividend} ÷ ${divisor} = ?`,
                correct: correctStr,
                options: Array.from(opts).sort(() => Math.random() - 0.5)
            };
            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizQ').innerText = currentQuiz.question;
            const box = document.getElementById('optsBox');
            box.innerHTML = '';
            currentQuiz.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = (e) => checkAnswer(opt, e.target);
                box.appendChild(btn);
            });
            updateUI();
        }

        function updateUI() {
            let rates = getRates(currentStar);
            renderStars();
            document.getElementById('starTxt').innerText = `★ ${currentStar} / ${MAX_STARS}성`;
            document.getElementById('topStarBadge').innerText = `★ ${currentStar} / ${MAX_STARS}성`;
            document.getElementById('sucRate').innerText = `${rates.success}%`;
            document.getElementById('dropRate').innerText = `${rates.drop}%`;
            document.getElementById('desRate').innerText = `0% (안전)`;

            let curWeapon = weapons[0];
            for(let w of weapons) {
                if(currentStar >= w.level) curWeapon = w;
            }
            document.getElementById('itemName').innerText = curWeapon.name;
            document.getElementById('itemImg').src = curWeapon.img;
        }

        function checkAnswer(selected, btnEl) {
            if(selected === currentQuiz.correct) {
                runStarforceAnim();
            } else {
                btnEl.classList.remove('wrong-shake');
                void btnEl.offsetWidth;
                btnEl.classList.add('wrong-shake');
                applyPenalty();
            }
        }

        function applyPenalty() {
            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btn = document.getElementById('modalBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer';
            hammer.innerText = '⚠️';
            title.innerText = '오답 페널티!';
            title.style.color = '#c0392b';

            if (currentStar > 0) {
                currentStar--;
                desc.innerText = `틀렸습니다! 스타포스가 ★ ${currentStar}성으로 하락했습니다.`;
            } else {
                desc.innerText = '틀렸습니다! 정답을 다시 신중히 생각해보세요. (0성은 하락하지 않아요)';
            }

            btn.innerText = '다시 풀기';
            btn.style.display = 'inline-block';
            updateUI();
            generateQuiz();
        }

        function runStarforceAnim() {
            if (currentStar >= MAX_STARS) {
                alert("축하합니다! 이미 최고 등급인 ★ 22성에 도달했습니다!");
                return;
            }

            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btn = document.getElementById('modalBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer swing';
            hammer.innerText = '🔨';
            title.innerText = '민형쌤의 강화 주문서!';
            title.style.color = '#d35400';
            desc.innerText = '별의 기운이 퐁퐁 솟아납니다!';
            btn.style.display = 'none';

            setTimeout(() => {
                hammer.className = 'hammer';
                let rates = getRates(currentStar);
                let rand = Math.random() * 100;

                if(rand < rates.success) {
                    currentStar++;
                    hammer.innerText = '🌟';
                    title.innerText = 'SUCCESS!';
                    title.style.color = '#27ae60';
                    desc.innerText = `성공! ★ ${currentStar}성으로 캐릭터가 꾸며졌어요!`;
                } else {
                    currentStar = Math.max(0, currentStar - 1);
                    hammer.innerText = '💧';
                    title.innerText = 'FAIL (단계 하락)';
                    title.style.color = '#e67e22';
                    desc.innerText = `아쉬워요! ★ ${currentStar}성으로 내려갔어요. (파괴 없음!)`;
                }

                btn.innerText = '확인';
                btn.style.display = 'inline-block';
                updateUI();
                generateQuiz();
            }, 1200);
        }

        function closeModal() {
            document.getElementById('sfModal').style.display = 'none';
        }

        // 🎨 치이카와 캔버스 연출
        let animOffset = 0;
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animOffset += 0.05;

            ctx.fillStyle = '#81d4fa';
            ctx.fillRect(0, 0, canvas.width, 130);

            ctx.fillStyle = '#6d4c41';
            ctx.fillRect(90, 50, 18, 80);
            ctx.fillStyle = '#4caf50';
            ctx.beginPath(); ctx.arc(99, 45, 36, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#6d4c41';
            ctx.fillRect(canvas.width - 110, 40, 20, 90);
            ctx.fillStyle = '#66bb6a';
            ctx.beginPath(); ctx.arc(canvas.width - 100, 32, 40, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#a5d6a7';
            ctx.fillRect(0, 130, canvas.width, 60);
            ctx.fillStyle = '#81c784';
            ctx.fillRect(0, 130, canvas.width, 10);

            const cx = canvas.width / 2;
            const cy = 100 + Math.sin(animOffset) * 3;

            ctx.save();

            if (currentStar >= 15) {
                ctx.shadowBlur = 20 + Math.sin(animOffset) * 5;
                ctx.shadowColor = "#f39c12";
                ctx.fillStyle = "rgba(241, 196, 15, 0.45)";
                ctx.beginPath();
                ctx.arc(cx, cy, 58, 0, Math.PI * 2);
                ctx.fill();
            }

            let isHachiware = currentStar >= 10 && currentStar < 15;
            let isUsagi = currentStar >= 15;

            ctx.fillStyle = isUsagi ? "#fff176" : "#ffffff";
            ctx.strokeStyle = "#3e2723";
            ctx.lineWidth = 3;

            if (isUsagi) {
                ctx.beginPath(); ctx.ellipse(cx - 18, cy - 35, 8, 22, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.ellipse(cx + 18, cy - 35, 8, 22, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            } else {
                ctx.beginPath(); ctx.arc(cx - 24, cy - 22, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.arc(cx + 24, cy - 22, 12, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                if (isHachiware) {
                    ctx.fillStyle = "#42a5f5";
                    ctx.beginPath(); ctx.arc(cx - 24, cy - 22, 10, 0, Math.PI * 2); ctx.fill();
                    ctx.beginPath(); ctx.arc(cx + 24, cy - 22, 10, 0, Math.PI * 2); ctx.fill();
                }
            }

            ctx.fillStyle = isUsagi ? "#fff9c4" : "#ffffff";
            ctx.beginPath(); ctx.ellipse(cx, cy, 32, 28, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            if (currentStar >= 5 && currentStar < 18) {
                ctx.fillStyle = "#aed581";
                ctx.beginPath();
                ctx.fillRect(cx - 22, cy + 8, 44, 16);
                ctx.strokeRect(cx - 22, cy + 8, 44, 16);
                ctx.fillStyle = "#7cb342";
                ctx.fillRect(cx - 16, cy + 2, 6, 8);
                ctx.fillRect(cx + 10, cy + 2, 6, 8);
            }

            if (currentStar >= 18) {
                ctx.fillStyle = currentStar >= 22 ? "#ffee58" : "#b0bec5";
                ctx.fillRect(cx - 20, cy + 5, 40, 20);
                ctx.strokeRect(cx - 20, cy + 5, 40, 20);
            }

            ctx.fillStyle = "#ff80ab";
            ctx.beginPath(); ctx.arc(cx - 18, cy + 2, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 18, cy + 2, 5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#212121";
            ctx.beginPath(); ctx.arc(cx - 11, cy - 2, 3.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 11, cy - 2, 3.5, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(cx - 12, cy - 3, 1.2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(cx + 10, cy - 3, 1.2, 0, Math.PI * 2); ctx.fill();

            ctx.strokeStyle = "#212121";
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(cx - 5, cy + 8); ctx.lineTo(cx, cy + 11); ctx.lineTo(cx + 5, cy + 8); ctx.stroke();

            ctx.fillStyle = isUsagi ? "#fff9c4" : "#ffffff";
            ctx.beginPath(); ctx.arc(cx - 28, cy + 10, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            ctx.beginPath(); ctx.arc(cx + 28, cy + 10, 6, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

            if (currentStar >= 10) {
                ctx.fillStyle = "#8d6e63";
                ctx.fillRect(cx + 28, cy - 10, 5, 25);
                ctx.fillStyle = "#f1c40f";
                ctx.fillRect(cx + 25, cy + 5, 11, 4);
            }

            if (currentStar >= 19) {
                ctx.fillStyle = "#f1c40f";
                ctx.strokeStyle = "#d35400";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(cx - 12, cy - 26);
                ctx.lineTo(cx - 16, cy - 42);
                ctx.lineTo(cx - 5, cy - 34);
                ctx.lineTo(cx, cy - 46);
                ctx.lineTo(cx + 5, cy - 34);
                ctx.lineTo(cx + 16, cy - 42);
                ctx.lineTo(cx + 12, cy - 26);
                ctx.closePath();
                ctx.fill(); ctx.stroke();
            }

            ctx.restore();

            requestAnimationFrame(drawScene);
        }

        generateQuiz();
        drawScene();
    </script>
</body>
</html>
