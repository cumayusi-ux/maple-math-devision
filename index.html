<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민형쌤과 함께하는 나눗셈 정복</title>
    <style>
        @font-face {
            font-family: 'Maplestory';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Maplestory', 'Comic Sans MS', sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        h1 {
            color: #d35400;
            text-shadow: 2px 2px 0px #f39c12, -1px -1px 0px #fff;
            margin-bottom: 8px;
            font-size: 24px;
            letter-spacing: 1px;
            text-align: center;
        }

        .game-container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 1. 상단 숲속 사냥터 캔버스 */
        .map-frame {
            position: relative;
            width: 100%;
            height: 190px;
            border: 4px solid #f39c12;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            background: #81c784;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* 2. 하단 UI 영역 */
        .sf-window {
            background: #ffffff;
            border: 4px solid #f39c12;
            border-radius: 18px;
            padding: 12px 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #f39c12;
            padding-bottom: 6px;
            color: #d35400;
            font-size: 16px;
            font-weight: bold;
        }

        .sf-landscape-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 12px;
            align-items: stretch;
        }

        @media(max-width: 650px) {
            .sf-landscape-grid { grid-template-columns: 1fr; }
        }

        .sf-card-left {
            background: #fdfefe;
            border: 2px solid #8e44ad;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .item-preview {
            width: 75px; height: 75px;
            background: #fff;
            border: 3px solid #f1c40f;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 0;
            box-shadow: 0 0 12px rgba(241, 196, 15, 0.4);
        }

        .item-preview img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .item-title {
            font-size: 17px;
            color: #8e44ad;
            font-weight: bold;
        }

        /* 22개 별 슬롯 (4-4-4-4-4-2 띄어쓰기) */
        .stars-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 2px;
            margin: 4px 0;
            padding: 6px 12px;
            background: #f4f6f7;
            border-radius: 10px;
            border: 1px solid #e5e8e8;
        }

        .star-group {
            display: flex;
            gap: 2px;
            margin-right: 8px;
        }

        .star-group:last-child {
            margin-right: 0;
        }

        .star-slot {
            font-size: 15px;
            color: #bdc3c7;
            transition: all 0.2s;
        }

        .star-slot.filled {
            color: #f1c40f;
            text-shadow: 0 0 4px #f39c12;
            transform: scale(1.1);
        }

        .stars-count-txt {
            color: #d35400;
            font-size: 15px;
            font-weight: bold;
        }

        /* 성공 / 실패(하락) 2가지 확률만 깔끔하게 표시 */
        .rates-box-compact {
            width: 100%;
            font-size: 14px;
            background: #eaeded;
            padding: 6px 14px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            margin-top: 4px;
            color: #2c3e50;
        }

        .quiz-panel-right {
            background: #e8f8f5;
            border: 2px solid #16a085;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .quiz-q {
            font-size: 26px;
            color: #2c3e50;
            font-weight: bold;
            margin: 6px 0;
        }

        .quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .opt-btn {
            background: linear-gradient(to bottom, #3498db, #2980b9);
            color: #fff;
            border: 2px solid #fff;
            padding: 9px 10px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1f618d;
            transition: background 0.15s, transform 0.15s;
        }

        .opt-btn:hover {
            background: linear-gradient(to bottom, #f39c12, #e67e22);
            color: #fff;
            box-shadow: 0 3px 0 #d35400;
        }

        .opt-btn.wrong-shake {
            animation: shake 0.4s ease-in-out;
            background: linear-gradient(to bottom, #e74c3c, #c0392b) !important;
            border-color: #fadbd8 !important;
            color: #fff !important;
            box-shadow: 0 3px 0 #922b21 !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal-box {
            background: #ffffff;
            border: 4px solid #f39c12;
            border-radius: 18px;
            width: 320px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .hammer { font-size: 50px; display: inline-block; margin-bottom: 8px; }
        .swing { animation: hammerAnim 0.3s infinite alternate; }
        @keyframes hammerAnim {
            from { transform: rotate(-25deg); }
            to { transform: rotate(25deg); }
        }

        .m-btn {
            background: #f1c40f;
            color: #2c3e50;
            border: none;
            padding: 8px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
            font-weight: bold;
            box-shadow: 0 3px 0 #f39c12;
        }
    </style>
</head>
<body>

    <h1>🍁 민형쌤과 함께하는 나눗셈 정복 (안전 강화!) 🍁</h1>

    <div class="game-container">
        <!-- 1. 상단 숲속 화면 -->
        <div class="map-frame">
            <canvas id="gameCanvas" width="960" height="190"></canvas>
        </div>

        <!-- 2. 스타포스 가로형 배치 -->
        <div class="sf-window">
            <div class="sf-header">
                <span>⚔️ 스타포스 장비 강화소 (최대 ★22성 / 파괴 없음)</span>
                <span id="topStarBadge">★ 0성</span>
            </div>

            <div class="sf-landscape-grid">
                <!-- 좌측: 강화 카드 -->
                <div class="sf-card-left">
                    <div class="item-title" id="itemName">초보자의 목검</div>
                    <div class="item-preview">
                        <img id="itemImg" src="https://maplestory.io/api/KMS/352/item/1302000/icon" alt="무기">
                    </div>

                    <!-- 22개 별 슬롯 (4-4-4-4-4-2 띄어쓰기) -->
                    <div class="stars-container" id="starsBox"></div>
                    <div class="stars-count-txt" id="starTxt">★ 0 / 22성</div>

                    <!-- 성공 / 실패(하락) 확률만 깔끔하게 표시 -->
                    <div class="rates-box-compact">
                        <span>성공 확률: <b id="sucRate" style="color:#27ae60;">99.75%</b></span>
                        <span>실패(하락): <b id="dropRate" style="color:#e67e22;">0.25%</b></span>
                    </div>
                </div>

                <!-- 우측: 나눗셈 문제 패널 -->
                <div class="quiz-panel-right">
                    <div style="font-size: 13px; color: #c0392b; font-weight: bold;">⚠️ 오답 시 단계가 하락할 수 있으니 신중히 푸세요!</div>
                    <div class="quiz-q" id="quizQ">85 ÷ 4 = ?</div>
                    <div class="quiz-opts" id="optsBox"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="sfModal" class="modal-bg">
        <div class="modal-box">
            <div id="hammerIcon" class="hammer">🔨</div>
            <h2 id="modalTitle" style="color:#d35400; font-size:22px;">강화 진행 중...</h2>
            <div id="modalDesc" style="font-size:14px; margin-top:6px; color:#34495e;">주문서의 기운이 모입니다!</div>
            <button id="modalBtn" class="m-btn" onclick="closeModal()" style="display:none;">확인</button>
        </div>
    </div>

    <script>
        const MAX_STARS = 22;

        const weapons = [
            { level: 0, name: "초보자의 목검", img: "https://maplestory.io/api/KMS/352/item/1302000/icon" },
            { level: 3, name: "하이랜더", img: "https://maplestory.io/api/KMS/352/item/1402002/icon" },
            { level: 6, name: "호검", img: "https://maplestory.io/api/KMS/352/item/1402004/icon" },
            { level: 9, name: "그륜힐", img: "https://maplestory.io/api/KMS/352/item/1402008/icon" },
            { level: 12, name: "드래곤 클레이모어", img: "https://maplestory.io/api/KMS/352/item/1402018/icon" },
            { level: 15, name: "우트가르드 소드", img: "https://maplestory.io/api/KMS/352/item/1402220/icon" },
            { level: 18, name: "파프니르 페니텐시아", img: "https://maplestory.io/api/KMS/352/item/1402196/icon" },
            { level: 20, name: "아케인셰이드 두손검", img: "https://maplestory.io/api/KMS/352/item/1402255/icon" },
            { level: 22, name: "제네시스 투핸드소드", img: "https://maplestory.io/api/KMS/352/item/1402259/icon" }
        ];

        let currentStar = 0;
        let currentQuiz = {};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 성공 확률 및 실패(하락) 확률표 적용
        function getRates(star) {
            if (star >= MAX_STARS) return { success: 0, drop: 0 };

            const rateTable = {
                0:  { success: 99.75, drop: 0.25 },
                1:  { success: 9
