<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메이플스토리 스타포스 강화 시스템</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
        }

        body {
            background: #0b0f19 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 20px;
        }

        h1 {
            color: #f39c12;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 15px;
            font-size: 22px;
        }

        .game-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 850px;
            gap: 15px;
        }

        /* 게임 메인 사냥터 화면 */
        .field-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: linear-gradient(to bottom, #3b74bc, #a1c4fd);
            border: 3px solid #3e2723;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }

        /* 메이플 정통 스타포스 강화 창 UI (영상의 레이아웃 그대로 재현) */
        .starforce-window {
            background: linear-gradient(to bottom, #3c322b, #1f1814);
            border: 4px solid #8c6747;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #5a4231;
            padding-bottom: 8px;
            font-weight: bold;
            color: #f1c40f;
            font-size: 16px;
        }

        .sf-body-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media(max-width: 600px) {
            .sf-body-grid { grid-template-columns: 1fr; }
        }

        /* 왼쪽: 강화 대상 패널 */
        .sf-target-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #5a4231;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .item-slot {
            width: 70px; height: 70px;
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.5);
            margin: 8px 0;
        }

        .item-name {
            font-size: 15px;
            font-weight: bold;
            color: #ffeb3b;
            text-align: center;
        }

        .item-stars {
            color: #f1c40f;
            font-size: 16px;
            margin: 4px 0;
        }

        .rates-info {
            width: 100%;
            font-size: 13px;
            background: rgba(255,255,255,0.05);
            padding: 6px;
            border-radius: 4px;
            margin-top: 8px;
        }

        .rate-row {
            display: flex;
            justify-content: space-between;
            margin: 2px 0;
        }

        /* 오른쪽: 인벤토리 슬롯 격자 (유튜브 영상 우측 상단 UI 반영) */
        .sf-inventory-box {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #5a4231;
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .inventory-title {
            font-size: 13px;
            color: #ccc;
            margin-bottom: 8px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }

        .inven-slot {
            aspect-ratio: 1;
            background: #1b1613;
            border: 1px solid #5a4231;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .inven-slot.active {
            border-color: #f1c40f;
            background: #3a2e21;
            box-shadow: 0 0 6px #f1c40f;
        }

        /* 나눗셈 문제 풀이 패널 */
        .quiz-panel {
            background: #1e1b18;
            border: 2px solid #d4af37;
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .quiz-question {
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            margin: 10px 0;
            text-shadow: 1px 1px 2px #000;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 6px;
        }

        .option-btn {
            background: linear-gradient(to bottom, #5a4231, #3c322b);
            color: #fff;
            border: 1px solid #d4af37;
            padding: 10px;
            font-size: 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
        }

        .option-btn:hover {
            background: linear-gradient(to bottom, #d4af37, #b8860b);
            color: #000;
            font-weight: bold;
        }

        /* 스타포스 강화 연출 모달 (영상 속 화면 재현) */
        .sf-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .sf-modal-box {
            background: linear-gradient(to bottom, #4a3b2c, #1f1814);
            border: 4px solid #d4af37;
            border-radius: 10px;
            width: 340px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.6);
            animation: popUp 0.25s ease-out;
        }

        @keyframes popUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .hammer-icon {
            font-size: 55px;
            display: inline-block;
            margin-bottom: 10px;
        }
        .swing { animation: hammering 0.35s infinite alternate; }
        @keyframes hammering {
            from { transform: rotate(-25deg); }
            to { transform: rotate(25deg); }
        }

        .result-heading {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 8px;
            text-shadow: 2px 2px 4px #000;
        }

        .modal-btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 8px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        .modal-btn:hover { background: #f1c40f; }
    </style>
</head>
<body>

    <h1>🍁 메이플스토리 : 스타포스 강화 나눗셈 탐험대 🍁</h1>

    <div class="game-layout">
        <!-- 1. 미니 사냥터 화면 -->
        <div class="field-container">
            <canvas id="gameCanvas" width="850" height="220"></canvas>
        </div>

        <!-- 2. 메이플 정통 스타포스 UI 창 -->
        <div class="starforce-window">
            <div class="sf-header">
                <span>⚔️ EQUIP : 장비 강화 (Starforce)</span>
                <span id="topLvBadge" style="font-size: 12px; color: #aaa;">LV. 0</span>
            </div>

            <div class="sf-body-grid">
                <!-- 왼쪽: 대상 장비 슬롯 및 확률 -->
                <div class="sf-target-box">
                    <div class="item-name" id="weaponName">초보자의 목검</div>
                    <div class="item-slot" id="itemSlotIcon">🗡️</div>
                    <div class="item-stars" id="starDisplay">★ 0 / 50</div>
                    
                    <div class="rates-info">
                        <div class="rate-row"><span>성공률:</span> <b id="sucRateTxt" style="color:#2ecc71;">95%</b></div>
                        <div class="rate-row"><span>하락률:</span> <b id="dropRateTxt" style="color:#e67e22;">0%</b></div>
                        <div class="rate-row"><span>파괴률:</span> <b id="desRateTxt" style="color:#e74c3c;">0%</b></div>
                    </div>
                </div>

                <!-- 오른쪽: 인벤토리 장비 슬롯 격자 (영상 참고) -->
                <div class="sf-inventory-box">
                    <div class="inventory-title">소지 중인 장비 슬롯</div>
                    <div class="inventory-grid" id="invenGrid">
                        <!-- 동적 생성 -->
                    </div>
                </div>
            </div>

            <!-- 3. 나눗셈 문제 풀이 패널 -->
            <div class="quiz-panel">
                <div style="font-size: 13px; color: #aaa;">나눗셈 문제를 풀면 스타포스 강화 주문서가 발동합니다!</div>
                <div class="quiz-question" id="quizQuestion">85 ÷ 4 = ?</div>
                <div class="options-grid" id="optionsContainer">
                    <!-- 5지선다 버튼 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 스타포스 연출 모달 팝업 -->
    <div id="sfModal" class="sf-modal-overlay">
        <div class="sf-modal-box">
            <div id="hammerEl" class="hammer-icon">🔨</div>
            <div id="modalTitle" class="result-heading">강화 진행 중...</div>
            <div id="modalDesc" style="font-size: 14px; color: #ddd; margin-top: 5px;">주문서의 기운이 모이고 있습니다.</div>
            <button id="confirmBtn" class="modal-btn" onclick="closeModal()" style="display: none;">확인</button>
        </div>
    </div>

    <script>
        // 무기 계보 (목검부터 제네시스까지 10단계)
        const weapons = [
            { level: 0, name: "초보자의 목검", icon: "🗡️" },
            { level: 5, name: "하이랜더", icon: "⚔️" },
            { level: 10, name: "호검", icon: "🗡️" },
            { level: 15, name: "그륜힐", icon: "⚔️" },
            { level: 20, name: "드래곤 클레이모어", icon: "🛡️" },
            { level: 25, name: "우트가르드 소드", icon: "⚔️" },
            { level: 30, name: "파프니르 페니텐시아", icon: "🗡️" },
            { level: 35, name: "앱솔랩스 브로드세이버", icon: "⚔️" },
            { level: 40, name: "아케인셰이드 두손검", icon: "✨" },
            { level: 48, name: "제네시스 투핸드소드", icon: "🌟" }
        ];

        let currentStar = 0;
        let isDestroyed = false;
        let currentQuiz = {};

        // 캔버스 사냥터 설정
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const playerX = 100, monsterX = 650;
        let pAnim = 0;

        // 인벤토리 슬롯 초기화 (16칸)
        function initInventory() {
            const grid = document.getElementById('invenGrid');
            grid.innerHTML = '';
            for(let i=0; i<16; i++) {
                let slot = document.createElement('div');
                slot.className = 'inven-slot';
                if(i === 0) {
                    slot.classList.add('active');
                    slot.innerText = '🗡️';
                }
                grid.appendChild(slot);
            }
        }

        // 확률 계산기 (50성 체계)
        function getRates(star) {
            if (star < 10) return { success: 95 - star * 2, drop: 0, destroy: 0 };
            if (star < 20) return { success: Math.round(65 - (star-10)*1.5), drop: Math.round(20 + (star-10)), destroy: 0 };
            if (star < 35) {
                let des = 5 + Math.floor((star-20)/3);
                let suc = 45 - (star-20)*0.8;
                return { success: Math.round(suc), drop: Math.round(100 - suc - des), destroy: des };
            }
            if (star < 50) {
                let des = 10 + Math.floor((star-35));
                let suc = Math.max(10, Math.round(30 - (star-35)*0.5));
                return { success: suc, drop: Math.round(100 - suc - des), destroy: Math.min(40, des) };
            }
            return { success: 0, drop: 0, destroy: 0 };
        }

        // 나눗셈 문제 생성 (3학년 2학기: 두/세자리 ÷ 한자리, 나머지 포함)
        function generateQuiz() {
            const is3D = Math.random() < 0.5;
            const divisor = Math.floor(Math.random() * 8) + 2;
            const dividend = is3D ? Math.floor(Math.random() * 800) + 100 : Math.floor(Math.random() * 80) + 10;

            const q = Math.floor(dividend / divisor);
            const r = dividend % divisor;
            const correctStr = `몫: ${q}, 나머지: ${r}`;

            let opts = new Set();
            opts.add(correctStr);
            while(opts.size < 5) {
                let fq = q + (Math.floor(Math.random()*7) - 3);
                let fr = r + (Math.floor(Math.random()*5) - 2);
                if(fq < 0) fq = 0;
                if(fr < 0 || fr >= divisor) fr = Math.max(0, divisor - 1);
                opts.add(`몫: ${fq}, 나머지: ${fr}`);
            }

            currentQuiz = {
                question: `${dividend} ÷ ${divisor} = ?`,
                correct: correctStr,
                options: Array.from(opts).sort(() => Math.random() - 0.5)
            };
            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizQuestion').innerText = currentQuiz.question;
            const container = document.getElementById('optionsContainer');
            container.innerHTML = '';
            currentQuiz.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                container.appendChild(btn);
            });
            updateUI();
        }

        function updateUI() {
            let rates = getRates(currentStar);
            document.getElementById('starDisplay').innerText = `★ ${currentStar} / 50`;
            document.getElementById('sucRateTxt').innerText = `${rates.success}%`;
            document.getElementById('dropRateTxt').innerText = `${rates.drop}%`;
            document.getElementById('desRateTxt').innerText = `${rates.destroy}%`;

            let curWeapon = weapons[0];
            for(let w of weapons) {
                if(currentStar >= w.level) curWeapon = w;
            }
            document.getElementById('weaponName').innerText = curWeapon.name;
            document.getElementById('itemSlotIcon').innerText = curWeapon.icon;
            document.getElementById('topLvBadge').innerText = `현재 장비 단계: ★${currentStar}`;
        }

        function checkAnswer(selected) {
            if(isDestroyed) {
                alert("장비가 파괴되었습니다! 초기화 후 다시 도전하세요.");
                return;
            }
            if(selected === currentQuiz.correct) {
                runStarforceAnimation();
            } else {
                alert(`❌ 오답입니다!\n정답은 [${currentQuiz.correct}] 입니다.`);
                generateQuiz();
            }
        }

        function runStarforceAnimation() {
            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerEl');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btn = document.getElementById('confirmBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer-icon swing';
            hammer.innerText = '🔨';
            title.innerText = '스타포스 강화 중...';
            title.style.color = '#f1c40f';
            desc.innerText = '주문서의 힘이 장비에 주입되고 있습니다!';
            btn.style.display = 'none';

            setTimeout(() => {
                hammer.className = 'hammer-icon';
                let rates = getRates(currentStar);
                let rand = Math.random() * 100;

                if(rand < rates.success) {
                    currentStar++;
                    hammer.innerText = '✨';
                    title.innerText = 'SUCCESS!';
                    title.style.color = '#2ecc71';
                    desc.innerText = `축하합니다! ★ ${currentStar}성 강화에 성공했습니다!`;
                } else if(rand < rates.success + rates.drop) {
                    currentStar = Math.max(0, currentStar - 1);
                    hammer.innerText = '💧';
                    title.innerText = 'FAIL (단계 하락)';
                    title.style.color = '#e67e22';
                    desc.innerText = `강화에 실패하여 ★ ${currentStar}성으로 떨어졌습니다.`;
                } else {
                    isDestroyed = true;
                    hammer.innerText = '💥';
                    title.innerText = 'DESTROYED!';
                    title.style.color = '#e74c3c';
                    desc.innerText = '앗! 장비가 파괴되었습니다. (처음부터 다시)';
                    btn.innerText = '0성부터 다시 시작';
                }

                btn.style.display = 'inline-block';
                updateUI();
                generateQuiz();
            }, 1200);
        }

        function closeModal() {
            if(isDestroyed) {
                currentStar = 0;
                isDestroyed = false;
                updateUI();
            }
            document.getElementById('sfModal').style.display = 'none';
        }

        // 캔버스 애니메이션
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            pAnim += 0.05;

            // 배경 풀밭
            ctx.fillStyle = '#27ae60';
            ctx.fillRect(0, 160, canvas.width, 60);

            // 캐릭터
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(playerX, 110 + Math.sin(pAnim)*2, 25, 45);

            // 몬스터 (슬라임)
            ctx.fillStyle = '#2ecc71';
            ctx.beginPath();
            ctx.arc(monsterX, 145 + Math.cos(pAnim)*3, 18, Math.PI, 0);
            ctx.fill();

            requestAnimationFrame(drawScene);
        }

        initInventory();
        generateQuiz();
        drawScene();
    </script>
</body>
</html>
