<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민형쌤과 함께하는 나눗셈 정복</title>
    <style>
        @font-face {
            font-family: 'Maplestory';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Maplestory', 'Comic Sans MS', sans-serif;
        }

        body {
            background: #2b1055 url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
        }

        h1 {
            color: #ffeb3b;
            text-shadow: 3px 3px 0px #e67e22, -2px -2px 0px #000;
            margin-bottom: 15px;
            font-size: 28px;
            letter-spacing: 1px;
            text-align: center;
        }

        .game-container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* 사냥터 캔버스 프레임 */
        .map-frame {
            position: relative;
            width: 100%;
            height: 250px;
            border: 5px solid #ffb74d;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            background: #64b5f6;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        /* 스타포스 귀여운 창 UI */
        .sf-window {
            background: linear-gradient(to bottom, rgba(44, 24, 88, 0.95), rgba(20, 10, 45, 0.95));
            border: 4px solid #ffb74d;
            border-radius: 20px;
            padding: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 3px dashed #ffb74d;
            padding-bottom: 10px;
            color: #ffeb3b;
            font-size: 18px;
        }

        .sf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media(max-width: 600px) {
            .sf-grid { grid-template-columns: 1fr; }
        }

        /* 무기 상태 카드 */
        .sf-card {
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid #ab47bc;
            border-radius: 15px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .item-preview {
            width: 85px; height: 85px;
            background: #fff;
            border: 3px solid #ffeb3b;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 8px 0;
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
        }

        .item-preview img {
            width: 55px;
            height: 55px;
            object-fit: contain;
        }

        .item-title {
            font-size: 18px;
            color: #ffeb3b;
            text-shadow: 1px 1px 2px #000;
        }

        .stars-txt {
            color: #f1c40f;
            font-size: 20px;
            margin: 4px 0;
            text-shadow: 0 0 8px #ffeb3b;
        }

        .rates-box {
            width: 100%;
            font-size: 14px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            margin-top: 6px;
        }

        .rate-line {
            display: flex;
            justify-content: space-between;
            margin: 3px 0;
        }

        /* 귀여운 인벤토리 격자 */
        .inven-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }

        .inven-slot {
            aspect-ratio: 1;
            background: rgba(255,255,255,0.1);
            border: 2px solid #8e24aa;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .inven-slot img {
            width: 35px;
            height: 35px;
            object-fit: contain;
        }

        .inven-slot.active {
            border: 3px solid #ffeb3b;
            background: rgba(255, 235, 59, 0.2);
            box-shadow: 0 0 10px #ffeb3b;
        }

        /* 나눗셈 문제 귀여운 패널 */
        .quiz-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 3px solid #26c6da;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
        }

        .quiz-q {
            font-size: 28px;
            color: #fff;
            margin: 10px 0;
            text-shadow: 2px 2px 4px #000;
        }

        .wrong-msg {
            color: #ff5252;
            font-size: 16px;
            font-weight: bold;
            height: 22px;
            margin-bottom: 8px;
            text-shadow: 1px 1px 2px #000;
        }

        .quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .opt-btn {
            background: linear-gradient(to bottom, #42a5f5, #1e88e5);
            color: #fff;
            border: 2px solid #fff;
            padding: 12px;
            font-size: 17px;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1565c0;
            transition: all 0.1s;
        }

        .opt-btn:hover {
            background: linear-gradient(to bottom, #ffca28, #ffa726);
            color: #000;
            box-shadow: 0 4px 0 #e65100;
            transform: translateY(-2px);
        }

        .opt-btn:active {
            transform: translateY(2px);
            box-shadow: 0 0 0 #000;
        }

        /* 팝업 모달 */
        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal-box {
            background: linear-gradient(to bottom, #3f51b5, #1a237e);
            border: 4px solid #ffeb3b;
            border-radius: 20px;
            width: 330px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 0 35px #ffeb3b;
        }

        .hammer { font-size: 55px; display: inline-block; margin-bottom: 10px; }
        .swing { animation: hammerAnim 0.3s infinite alternate; }
        @keyframes hammerAnim {
            from { transform: rotate(-25deg); }
            to { transform: rotate(25deg); }
        }

        .m-btn {
            background: #ffeb3b;
            color: #000;
            border: none;
            padding: 10px 22px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 0 #f57f17;
        }
    </style>
</head>
<body>

    <h1>🍁 민형쌤과 함께하는 나눗셈 정복 🍁</h1>

    <div class="game-container">
        <!-- 사냥터 화면 -->
        <div class="map-frame">
            <canvas id="gameCanvas" width="820" height="250"></canvas>
        </div>

        <!-- 스타포스 UI -->
        <div class="sf-window">
            <div class="sf-header">
                <span>⚔️ 스타포스 장비 강화소</span>
                <span id="topStarBadge">★ 0성</span>
            </div>

            <div class="sf-grid">
                <!-- 무기 카드 -->
                <div class="sf-card">
                    <div class="item-title" id="itemName">초보자의 목검</div>
                    <div class="item-preview">
                        <img id="itemImg" src="https://maplestory.io/api/KMS/352/item/1302000/icon" alt="무기">
                    </div>
                    <div class="stars-txt" id="starTxt">★ 0 / 50성</div>

                    <div class="rates-box">
                        <div class="rate-line"><span>성공 확률:</span> <b id="sucRate" style="color:#2ecc71;">95%</b></div>
                        <div class="rate-line"><span>하락 확률:</span> <b id="dropRate" style="color:#ff9800;">0%</b></div>
                        <div class="rate-line"><span>파괴 확률:</span> <b id="desRate" style="color:#e74c3c;">0%</b></div>
                    </div>
                </div>

                <!-- 인벤토리 -->
                <div class="sf-card" style="align-items: flex-start;">
                    <div style="font-size: 14px; color: #ffeb3b;">내 장비 가방</div>
                    <div class="inven-grid" id="invenGrid"></div>
                </div>
            </div>

            <!-- 나눗셈 문제 풀이 패널 -->
            <div class="quiz-panel">
                <div style="font-size: 14px; color: #b2ebf2;">정답을 맞히면 민형쌤의 주문서 강화가 시작됩니다!</div>
                <div class="quiz-q" id="quizQ">85 ÷ 4 = ?</div>
                <div class="wrong-msg" id="wrongMsg"></div>
                <div class="quiz-opts" id="optsBox"></div>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="sfModal" class="modal-bg">
        <div class="modal-box">
            <div id="hammerIcon" class="hammer">🔨</div>
            <h2 id="modalTitle" style="color:#ffeb3b; font-size:24px;">강화 진행 중...</h2>
            <div id="modalDesc" style="font-size:15px; margin-top:8px; color:#e0e0e0;">주문서의 귀여운 기운이 모입니다!</div>
            <button id="modalBtn" class="m-btn" onclick="closeModal()" style="display:none;">확인</button>
        </div>
    </div>

    <script>
        const weapons = [
            { level: 0, name: "초보자의 목검", img: "https://maplestory.io/api/KMS/352/item/1302000/icon" },
            { level: 5, name: "하이랜더", img: "https://maplestory.io/api/KMS/352/item/1402002/icon" },
            { level: 10, name: "호검", img: "https://maplestory.io/api/KMS/352/item/1402004/icon" },
            { level: 15, name: "그륜힐", img: "https://maplestory.io/api/KMS/352/item/1402008/icon" },
            { level: 20, name: "드래곤 클레이모어", img: "https://maplestory.io/api/KMS/352/item/1402018/icon" },
            { level: 25, name: "우트가르드 소드", img: "https://maplestory.io/api/KMS/352/item/1402220/icon" },
            { level: 30, name: "파프니르 페니텐시아", img: "https://maplestory.io/api/KMS/352/item/1402196/icon" },
            { level: 35, name: "앱솔랩스 브로드세이버", img: "https://maplestory.io/api/KMS/352/item/1402225/icon" },
            { level: 40, name: "아케인셰이드 두손검", img: "https://maplestory.io/api/KMS/352/item/1402255/icon" },
            { level: 48, name: "제네시스 투핸드소드", img: "https://maplestory.io/api/KMS/352/item/1402259/icon" }
        ];

        let currentStar = 0;
        let isDestroyed = false;
        let currentQuiz = {};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function initInven() {
            const grid = document.getElementById('invenGrid');
            grid.innerHTML = '';
            for(let i=0; i<16; i++) {
                let slot = document.createElement('div');
                slot.className = 'inven-slot';
                if(i === 0) {
                    slot.classList.add('active');
                    let img = document.createElement('img');
                    img.id = 'invenSlotImg';
                    img.src = weapons[0].img;
                    slot.appendChild(img);
                }
                grid.appendChild(slot);
            }
        }

        function getRates(star) {
            if (star < 10) return { success: 95 - star * 2, drop: 0, destroy: 0 };
            if (star < 20) return { success: Math.round(65 - (star-10)*1.5), drop: Math.round(20 + (star-10)), destroy: 0 };
            if (star < 35) {
                let des = 5 + Math.floor((star-20)/3);
                let suc = 45 - (star-20)*0.8;
                return { success: Math.round(suc), drop: Math.round(100 - suc - des), destroy: des };
            }
            if (star < 50) {
                let des = 10 + Math.floor((star-35));
                let suc = Math.max(10, Math.round(30 - (star-35)*0.5));
                return { success: suc, drop: Math.round(100 - suc - des), destroy: Math.min(40, des) };
            }
            return { success: 0, drop: 0, destroy: 0 };
        }

        function generateQuiz() {
            document.getElementById('wrongMsg').innerText = ''; // 경고 문구 초기화
            const is3D = Math.random() < 0.5;
            const divisor = Math.floor(Math.random() * 8) + 2;
            const dividend = is3D ? Math.floor(Math.random() * 800) + 100 : Math.floor(Math.random() * 80) + 10;

            const q = Math.floor(dividend / divisor);
            const r = dividend % divisor;
            const correctStr = `몫: ${q}, 나머지: ${r}`;

            let opts = new Set();
            opts.add(correctStr);
            while(opts.size < 5) {
                let fq = q + (Math.floor(Math.random()*7) - 3);
                let fr = r + (Math.floor(Math.random()*5) - 2);
                if(fq < 0) fq = 0;
                if(fr < 0 || fr >= divisor) fr = Math.max(0, divisor - 1);
                opts.add(`몫: ${fq}, 나머지: ${fr}`);
            }

            currentQuiz = {
                question: `${dividend} ÷ ${divisor} = ?`,
                correct: correctStr,
                options: Array.from(opts).sort(() => Math.random() - 0.5)
            };
            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizQ').innerText = currentQuiz.question;
            const box = document.getElementById('optsBox');
            box.innerHTML = '';
            currentQuiz.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                box.appendChild(btn);
            });
            updateUI();
        }

        function updateUI() {
            let rates = getRates(currentStar);
            document.getElementById('starTxt').innerText = `★ ${currentStar} / 50성`;
            document.getElementById('topStarBadge').innerText = `★ ${currentStar}성`;
            document.getElementById('sucRate').innerText = `${rates.success}%`;
            document.getElementById('dropRate').innerText = `${rates.drop}%`;
            document.getElementById('desRate').innerText = `${rates.destroy}%`;

            let curWeapon = weapons[0];
            for(let w of weapons) {
                if(currentStar >= w.level) curWeapon = w;
            }
            document.getElementById('itemName').innerText = curWeapon.name;
            document.getElementById('itemImg').src = curWeapon.img;

            let invenImg = document.getElementById('invenSlotImg');
            if(invenImg) invenImg.src = curWeapon.img;
        }

        function checkAnswer(selected) {
            if(isDestroyed) {
                alert("무기가 파괴되었습니다! 모달 창에서 초기화 후 다시 도전하세요.");
                return;
            }
            if(selected === currentQuiz.correct) {
                runStarforceAnim();
            } else {
                // 오답일 때: 정답을 공개하지 않고 경고 문구만 표시
                document.getElementById('wrongMsg').innerText = "❌ 정답이 아닙니다! 다시 한 번 생각해보세요.";
            }
        }

        function runStarforceAnim() {
            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btn = document.getElementById('modalBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer swing';
            hammer.innerText = '🔨';
            title.innerText = '민형쌤의 강화 주문서!';
            title.style.color = '#ffeb3b';
            desc.innerText = '별의 기운이 퐁퐁 솟아납니다!';
            btn.style.display = 'none';

            setTimeout(() => {
                hammer.className = 'hammer';
                let rates = getRates(currentStar);
                let rand = Math.random() * 100;

                if(rand < rates.success) {
                    currentStar++;
                    hammer.innerText = '🌟';
                    title.innerText = 'SUCCESS!';
                    title.style.color = '#2ecc71';
                    desc.innerText = `성공! ★ ${currentStar}성으로 단단해졌어요!`;
                } else if(rand < rates.success + rates.drop) {
                    currentStar = Math.max(0, currentStar - 1);
                    hammer.innerText = '💧';
                    title.innerText = 'FAIL (단계 하락)';
                    title.style.color = '#ff9800';
                    desc.innerText = `아쉬워요! ★ ${currentStar}성으로 내려갔어요.`;
                } else {
                    isDestroyed = true;
                    hammer.innerText = '💥';
                    title.innerText = 'DESTROYED!';
                    title.style.color = '#e74c3c';
                    desc.innerText = '장비가 파괴되었어요! 0성부터 다시 시도해보세요.';
                    btn.innerText = '0성부터 다시 시작';
                }

                btn.style.display = 'inline-block';
                updateUI();
                generateQuiz();
            }, 1200);
        }

        function closeModal() {
            if(isDestroyed) {
                currentStar = 0;
                isDestroyed = false;
                updateUI();
            }
            document.getElementById('sfModal').style.display = 'none';
        }

        let animOffset = 0;
        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            animOffset += 0.05;

            ctx.fillStyle = '#64b5f6';
            ctx.fillRect(0, 0, canvas.width, 170);

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(100, 50, 25, 0, Math.PI*2);
            ctx.arc(125, 45, 30, 0, Math.PI*2);
            ctx.arc(150, 50, 25, 0, Math.PI*2);
            ctx.fill();

            ctx.fillStyle = '#81c784';
            ctx.fillRect(0, 170, canvas.width, 80);
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(0, 170, canvas.width, 12);

            let mY = 140 + Math.sin(animOffset)*5;
            ctx.fillStyle = '#ff7043';
            ctx.beginPath();
            ctx.arc(620, mY, 26, Math.PI, 0);
            ctx.fill();
            ctx.fillStyle = '#fff8e1';
            ctx.fillRect(607, mY, 26, 22);

            ctx.fillStyle = '#ec407a';
            ctx.fillRect(120, 135, 24, 40);

            requestAnimationFrame(drawScene);
        }

        initInven();
        generateQuiz();
        drawScene();
    </script>
</body>
</html>
