<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>민형쌤과 함께하는 나눗셈 정복</title>
    <style>
        @font-face {
            font-family: 'Maplestory';
            src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_20-04@2.1/MaplestoryOTFBold.woff') format('woff');
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            font-family: 'Maplestory', 'Comic Sans MS', sans-serif;
        }

        body {
            background: #110e21;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 10px;
        }

        h1 {
            color: #ffeb3b;
            text-shadow: 2px 2px 0px #e67e22, -1px -1px 0px #000;
            margin-bottom: 8px;
            font-size: 22px;
            letter-spacing: 1px;
            text-align: center;
        }

        .game-container {
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .map-frame {
            position: relative;
            width: 100%;
            height: 190px;
            border: 4px solid #ffb74d;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            background: #81c784;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .character-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -60%);
            display: flex;
            flex-direction: column;
            align-items: center;
            pointer-events: none;
        }

        .avatar-img {
            height: 95px;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .avatar-aura {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,235,59,0.4) 0%, rgba(255,235,59,0) 70%);
            animation: pulseAura 1.5s infinite alternate;
            display: none;
        }

        @keyframes pulseAura {
            from { transform: scale(0.8); opacity: 0.5; }
            to { transform: scale(1.2); opacity: 0.9; }
        }

        .sf-window {
            background: linear-gradient(to bottom, rgba(40, 25, 75, 0.95), rgba(18, 10, 40, 0.95));
            border: 4px solid #ffb74d;
            border-radius: 18px;
            padding: 12px 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed #ffb74d;
            padding-bottom: 6px;
            color: #ffeb3b;
            font-size: 16px;
        }

        .sf-landscape-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 12px;
            align-items: stretch;
        }

        @media(max-width: 650px) {
            .sf-landscape-grid { grid-template-columns: 1fr; }
        }

        .sf-card-left {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid #ab47bc;
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        .item-preview {
            width: 75px; height: 75px;
            background: #fff;
            border: 3px solid #ffeb3b;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 4px 0;
            box-shadow: 0 0 15px rgba(255, 235, 59, 0.6);
        }

        .item-preview img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .item-title {
            font-size: 17px;
            color: #ffeb3b;
            text-shadow: 1px 1px 2px #000;
        }

        .stars-txt {
            color: #f1c40f;
            font-size: 19px;
            text-shadow: 0 0 8px #ffeb3b;
        }

        .rates-box-compact {
            width: 100%;
            font-size: 12px;
            background: rgba(0,0,0,0.35);
            padding: 6px 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-around;
            margin-top: 4px;
        }

        .quiz-panel-right {
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid #26c6da;
            border-radius: 14px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .quiz-q {
            font-size: 24px;
            color: #fff;
            margin: 6px 0;
            text-shadow: 2px 2px 3px #000;
        }

        .quiz-opts {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .opt-btn {
            background: linear-gradient(to bottom, #42a5f5, #1e88e5);
            color: #fff;
            border: 2px solid #fff;
            padding: 8px 10px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 3px 0 #1565c0;
            transition: background 0.15s, transform 0.15s;
        }

        .opt-btn:hover {
            background: linear-gradient(to bottom, #ffca28, #ffa726);
            color: #000;
            box-shadow: 0 3px 0 #e65100;
        }

        /* 💥 오답 페널티 애니메이션 */
        .opt-btn.wrong-shake {
            animation: shake 0.4s ease-in-out;
            background: linear-gradient(to bottom, #e53935, #c62828) !important;
            border-color: #ff8a80 !important;
            color: #fff !important;
            box-shadow: 0 3px 0 #b71c1c !important;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-10px); }
            40% { transform: translateX(10px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
            100% { transform: translateX(0); }
        }

        .modal-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            display: none;
        }

        .modal-box {
            background: linear-gradient(to bottom, #3f51b5, #1a237e);
            border: 4px solid #ffeb3b;
            border-radius: 18px;
            width: 330px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 30px #ffeb3b;
        }

        .hammer { font-size: 50px; display: inline-block; margin-bottom: 8px; }
        .swing { animation: hammerAnim 0.3s infinite alternate; }
        @keyframes hammerAnim {
            from { transform: rotate(-25deg); }
            to { transform: rotate(25deg); }
        }

        .m-btn {
            background: #ffeb3b;
            color: #000;
            border: none;
            padding: 8px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 12px;
            box-shadow: 0 3px 0 #f57f17;
        }
    </style>
</head>
<body>

    <h1>🍁 민형쌤과 함께하는 나눗셈 정복 🍁</h1>

    <div class="game-container">
        <div class="map-frame">
            <canvas id="gameCanvas" width="960" height="190"></canvas>
            <div class="character-overlay">
                <div class="avatar-aura" id="avatarAura"></div>
                <img id="mainAvatar" class="avatar-img" src="https://maplestory.io/api/KMS/352/character/center/2000,1040002,1060006/stand1/0?showRank=false" alt="메이플 아바타">
            </div>
        </div>

        <div class="sf-window">
            <div class="sf-header">
                <span>⚔️ 스타포스 장비 강화소</span>
                <span id="topStarBadge">★ 0성</span>
            </div>

            <div class="sf-landscape-grid">
                <div class="sf-card-left">
                    <div class="item-title" id="itemName">초보자의 목검</div>
                    <div class="item-preview">
                        <img id="itemImg" src="https://maplestory.io/api/KMS/352/item/1302000/icon" alt="무기">
                    </div>
                    <div class="stars-txt" id="starTxt">★ 0 / 50성</div>

                    <div class="rates-box-compact">
                        <span>성공: <b id="sucRate" style="color:#2ecc71;">95%</b></span>
                        <span>하락: <b id="dropRate" style="color:#ff9800;">0%</b></span>
                        <span>파괴: <b id="desRate" style="color:#e74c3c;">0%</b></span>
                    </div>
                </div>

                <div class="quiz-panel-right">
                    <div style="font-size: 13px; color: #ffeb3b;">⚠️ 찍기 금지! 오답 시 스타포스가 하락합니다!</div>
                    <div class="quiz-q" id="quizQ">85 ÷ 4 = ?</div>
                    <div class="quiz-opts" id="optsBox"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 모달 -->
    <div id="sfModal" class="modal-bg">
        <div class="modal-box" id="modalBoxContainer">
            <div id="hammerIcon" class="hammer">🔨</div>
            <h2 id="modalTitle" style="color:#ffeb3b; font-size:22px;">강화 진행 중...</h2>
            <div id="modalDesc" style="font-size:14px; margin-top:6px; color:#e0e0e0;">주문서의 기운이 모입니다!</div>
            <button id="modalBtn" class="m-btn" onclick="closeModal()" style="display:none;">확인</button>
        </div>
    </div>

    <script>
        const weapons = [
            { level: 0, name: "초보자의 목검", img: "https://maplestory.io/api/KMS/352/item/1302000/icon" },
            { level: 5, name: "하이랜더", img: "https://maplestory.io/api/KMS/352/item/1402002/icon" },
            { level: 10, name: "호검", img: "https://maplestory.io/api/KMS/352/item/1402004/icon" },
            { level: 15, name: "그륜힐", img: "https://maplestory.io/api/KMS/352/item/1402008/icon" },
            { level: 20, name: "드래곤 클레이모어", img: "https://maplestory.io/api/KMS/352/item/1402018/icon" },
            { level: 25, name: "우트가르드 소드", img: "https://maplestory.io/api/KMS/352/item/1402220/icon" },
            { level: 30, name: "파프니르 페니텐시아", img: "https://maplestory.io/api/KMS/352/item/1402196/icon" },
            { level: 35, name: "앱솔랩스 브로드세이버", img: "https://maplestory.io/api/KMS/352/item/1402225/icon" },
            { level: 40, name: "아케인셰이드 두손검", img: "https://maplestory.io/api/KMS/352/item/1402255/icon" },
            { level: 48, name: "제네시스 투핸드소드", img: "https://maplestory.io/api/KMS/352/item/1402259/icon" }
        ];

        const avatarSprites = [
            "https://maplestory.io/api/KMS/352/character/center/2000,1040002,1060006/stand1/0?showRank=false",
            "https://maplestory.io/api/KMS/352/character/center/2000,1042003,1062007,1302000/stand1/0?showRank=false",
            "https://maplestory.io/api/KMS/352/character/center/2000,1042144,1062164,1402008/stand1/0?showRank=false",
            "https://maplestory.io/api/KMS/352/character/center/2000,1052610,1003796,1402196/stand1/0?showRank=false",
            "https://maplestory.io/api/KMS/352/character/center/2000,1053063,1004808,1402259/stand1/0?showRank=false"
        ];

        let currentStar = 0;
        let isDestroyed = false;
        let currentQuiz = {};

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function getRates(star) {
            if (star < 10) return { success: 95 - star * 2, drop: 0, destroy: 0 };
            if (star < 20) return { success: Math.round(65 - (star-10)*1.5), drop: Math.round(20 + (star-10)), destroy: 0 };
            if (star < 35) {
                let des = 5 + Math.floor((star-20)/3);
                let suc = 45 - (star-20)*0.8;
                return { success: Math.round(suc), drop: Math.round(100 - suc - des), destroy: des };
            }
            if (star < 50) {
                let des = 10 + Math.floor((star-35));
                let suc = Math.max(10, Math.round(30 - (star-35)*0.5));
                return { success: suc, drop: Math.round(100 - suc - des), destroy: Math.min(40, des) };
            }
            return { success: 0, drop: 0, destroy: 0 };
        }

        function generateQuiz() {
            const is3D = Math.random() < 0.5;
            const divisor = Math.floor(Math.random() * 8) + 2;
            const dividend = is3D ? Math.floor(Math.random() * 800) + 100 : Math.floor(Math.random() * 80) + 10;

            const q = Math.floor(dividend / divisor);
            const r = dividend % divisor;
            const correctStr = `몫: ${q}, 나머지: ${r}`;

            let opts = new Set();
            opts.add(correctStr);
            while(opts.size < 5) {
                let fq = q + (Math.floor(Math.random()*7) - 3);
                let fr = r + (Math.floor(Math.random()*5) - 2);
                if(fq < 0) fq = 0;
                if(fr < 0 || fr >= divisor) fr = Math.max(0, divisor - 1);
                opts.add(`몫: ${fq}, 나머지: ${fr}`);
            }

            currentQuiz = {
                question: `${dividend} ÷ ${divisor} = ?`,
                correct: correctStr,
                options: Array.from(opts).sort(() => Math.random() - 0.5)
            };
            renderQuiz();
        }

        function renderQuiz() {
            document.getElementById('quizQ').innerText = currentQuiz.question;
            const box = document.getElementById('optsBox');
            box.innerHTML = '';
            currentQuiz.options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerText = opt;
                btn.onclick = (e) => checkAnswer(opt, e.target);
                box.appendChild(btn);
            });
            updateUI();
        }

        function updateUI() {
            let rates = getRates(currentStar);
            document.getElementById('starTxt').innerText = `★ ${currentStar} / 50성`;
            document.getElementById('topStarBadge').innerText = `★ ${currentStar}성`;
            document.getElementById('sucRate').innerText = `${rates.success}%`;
            document.getElementById('dropRate').innerText = `${rates.drop}%`;
            document.getElementById('desRate').innerText = `${rates.destroy}%`;

            let curWeapon = weapons[0];
            for(let w of weapons) {
                if(currentStar >= w.level) curWeapon = w;
            }
            document.getElementById('itemName').innerText = curWeapon.name;
            document.getElementById('itemImg').src = curWeapon.img;

            const avatarImg = document.getElementById('mainAvatar');
            const auraEl = document.getElementById('avatarAura');
            
            if (currentStar >= 40) {
                avatarImg.src = avatarSprites[4];
                auraEl.style.display = 'block';
            } else if (currentStar >= 28) {
                avatarImg.src = avatarSprites[3];
                auraEl.style.display = 'none';
            } else if (currentStar >= 15) {
                avatarImg.src = avatarSprites[2];
                auraEl.style.display = 'none';
            } else if (currentStar >= 5) {
                avatarImg.src = avatarSprites[1];
                auraEl.style.display = 'none';
            } else {
                avatarImg.src = avatarSprites[0];
                auraEl.style.display = 'none';
            }
        }

        // 🚨 오답 시 페널티 (스타포스 단계 하락 or 파괴)
        function checkAnswer(selected, btnEl) {
            if(isDestroyed) {
                alert("장비가 파괴되었습니다! 0성부터 다시 시도하세요.");
                return;
            }

            if(selected === currentQuiz.correct) {
                runStarforceAnim();
            } else {
                // 오답 페널티 실행!
                btnEl.classList.remove('wrong-shake');
                void btnEl.offsetWidth;
                btnEl.classList.add('wrong-shake');

                applyPenalty();
            }
        }

        function applyPenalty() {
            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btn = document.getElementById('modalBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer';
            hammer.innerText = '⚠️';
            title.innerText = '오답 페널티 발동!';
            title.style.color = '#e74c3c';

            if (currentStar > 0) {
                // 고레벨 오답 시 파괴 가능성
                if (currentStar >= 20 && Math.random() < 0.15) {
                    isDestroyed = true;
                    title.innerText = '💥 오답으로 장비 파괴!';
                    desc.innerText = '틀린 답을 선택하여 장비가 파괴되었습니다. (0성 초기화)';
                    btn.innerText = '0성부터 다시 시작';
                } else {
                    currentStar--;
                    desc.innerText = `오답을 선택하여 스타포스가 ★ ${currentStar}성으로 하락했습니다!`;
                    btn.innerText = '다시 신중하게 풀기';
                }
            } else {
                desc.innerText = '틀렸습니다! 정답을 다시 신중히 생각해보세요.';
                btn.innerText = '다시 풀기';
            }

            btn.style.display = 'inline-block';
            updateUI();
            generateQuiz();
        }

        function runStarforceAnim() {
            const modal = document.getElementById('sfModal');
            const hammer = document.getElementById('hammerIcon');
            const title = document.getElementById('modalTitle');
            const desc = document.getElementById('modalDesc');
            const btn = document.getElementById('modalBtn');

            modal.style.display = 'flex';
            hammer.className = 'hammer swing';
            hammer.innerText = '🔨';
            title.innerText = '민형쌤의 강화 주문서!';
            title.style.color = '#ffeb3b';
            desc.innerText = '별의 기운이 퐁퐁 솟아납니다!';
            btn.style.display = 'none';

            setTimeout(() => {
                hammer.className = 'hammer';
                let rates = getRates(currentStar);
                let rand = Math.random() * 100;

                if(rand < rates.success) {
                    currentStar++;
                    hammer.innerText = '🌟';
                    title.innerText = 'SUCCESS!';
                    title.style.color = '#2ecc71';
                    desc.innerText = `성공! ★ ${currentStar}성으로 캐릭터가 강해졌어요!`;
                } else if(rand < rates.success + rates.drop) {
                    currentStar = Math.max(0, currentStar - 1);
                    hammer.innerText = '💧';
                    title.innerText = 'FAIL (단계 하락)';
                    title.style.color = '#ff9800';
                    desc.innerText = `아쉬워요! ★ ${currentStar}성으로 내려갔어요.`;
                } else {
                    isDestroyed = true;
                    hammer.innerText = '💥';
                    title.innerText = 'DESTROYED!';
                    title.style.color = '#e74c3c';
                    desc.innerText = '장비가 파괴되었어요! 0성부터 다시 시도해보세요.';
                    btn.innerText = '0성부터 다시 시작';
                }

                btn.style.display = 'inline-block';
                updateUI();
                generateQuiz();
            }, 1200);
        }

        function closeModal() {
            if(isDestroyed) {
                currentStar = 0;
                isDestroyed = false;
                updateUI();
            }
            document.getElementById('sfModal').style.display = 'none';
        }

        function drawScene() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#64b5f6';
            ctx.fillRect(0, 0, canvas.width, 130);

            ctx.fillStyle = '#5d4037';
            ctx.fillRect(80, 50, 20, 80);
            ctx.fillStyle = '#2e7d32';
            ctx.beginPath(); ctx.arc(90, 45, 38, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#5d4037';
            ctx.fillRect(canvas.width - 100, 40, 22, 90);
            ctx.fillStyle = '#388e3c';
            ctx.beginPath(); ctx.arc(canvas.width - 89, 32, 42, 0, Math.PI * 2); ctx.fill();

            ctx.fillStyle = '#81c784';
            ctx.fillRect(0, 130, canvas.width, 60);
            ctx.fillStyle = '#4caf50';
            ctx.fillRect(0, 130, canvas.width, 10);

            requestAnimationFrame(drawScene);
        }

        generateQuiz();
        drawScene();
    </script>
</body>
</html>
